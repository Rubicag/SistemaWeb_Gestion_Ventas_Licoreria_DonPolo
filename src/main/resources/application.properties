# Configuración mínima para Spring Boot
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/licoreria_donpolo?zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.banner-mode=off
# Habilitar logs DEBUG para diagnosticar Spring Security
logging.level.org.springframework.security=DEBUG

# Configuración para Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Configuración de logs
logging.file.name=logs/application.log
logging.level.root=INFO
