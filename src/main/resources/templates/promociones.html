<div th:replace="~{fragments/layout :: base(title='Promociones', active='promociones')}">
    <div th:fragment="head">
        <link rel="stylesheet" th:href="@{/css/promociones.css}" />
    </div>
    <div th:fragment="content">
            <div class="container-main">
        <!-- Alertas Modernas -->
        <div th:if="${mensaje}" class="alert alert-modern alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-modern alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Acciones -->
        <div class="row mb-4">
            <div class="col-md-6">
                <button onclick="nuevaPromocion()" class="btn btn-primary-custom">
                    <i class="fas fa-plus-circle"></i> Nueva Promoción
                </button>
            </div>
            <div class="col-md-6">
                <select class="form-select search-box float-end" id="filtroEstado" onchange="filtrarPorEstado()">
                    <option value="">Todas las promociones</option>
                    <option value="ACTIVA">Activas</option>
                    <option value="PROGRAMADA">Programadas</option>
                    <option value="FINALIZADA">Finalizadas</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Promociones -->
        <div class="table-responsive">
            <table class="table table-hover" id="tablaPromociones">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Descuento</th>
                        <th>Vigencia</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="promo : ${promociones}">
                        <td th:text="${promo.idPromocion}">1</td>
                        <td>
                            <strong th:text="${promo.nombre}">Cyber Wow</strong><br>
                            <small th:text="${promo.descripcion}">Promoción especial</small>
                        </td>
                        <td>
                            <span class="badge bg-primary" th:text="${promo.tipoPromocion}">PORCENTAJE</span>
                        </td>
                        <td>
                            <span class="discount-badge" th:if="${promo.tipoPromocion == 'PORCENTAJE'}">
                                <span th:text="${promo.descuento}">15</span>%
                            </span>
                            <span class="discount-badge" th:if="${promo.tipoPromocion == 'MONTO_FIJO'}">
                                -S/ <span th:text="${#numbers.formatDecimal(promo.descuento, 1, 2)}">10.00</span>
                            </span>
                            <span class="badge bg-success" th:if="${promo.tipoPromocion == '2X1'}">2x1</span>
                        </td>
                        <td>
                            <small>
                                <strong>Desde:</strong> <span th:text="${#temporals.format(promo.fechaInicio, 'dd/MM/yyyy')}">01/11/2025</span><br>
                                <strong>Hasta:</strong> <span th:text="${#temporals.format(promo.fechaFin, 'dd/MM/yyyy')}">30/11/2025</span>
                            </small>
                        </td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${promo.estado == 'ACTIVA'} ? 'bg-success' : (${promo.estado == 'PROGRAMADA'} ? 'bg-warning' : 'bg-secondary')"
                                  th:text="${promo.estado}">ACTIVA</span>
                        </td>
                        <td>
                            <button th:attr="data-promocion-id=${promo.idPromocion}"
                                    class="btn btn-sm btn-info btn-ver-promocion" title="Ver Detalle">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button th:if="${promo.estado != 'FINALIZADA'}"
                                    th:attr="data-promocion-id=${promo.idPromocion}"
                                    class="btn btn-sm btn-warning btn-editar-promocion" title="Editar">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button th:if="${promo.estado == 'ACTIVA'}"
                                    th:attr="data-promocion-id=${promo.idPromocion}"
                                    class="btn btn-sm btn-danger btn-finalizar-promocion" title="Finalizar">
                                <i class="fas fa-stop"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(promociones)}">
                        <td colspan="7" class="text-center text-muted">
                            <i class="fas fa-inbox fa-3x mb-3"></i><br>
                            No hay promociones registradas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Promoción -->
    <div class="modal fade" id="modalPromocion" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-tags"></i> <span id="modalTitulo">Nueva Promoción</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPromocion" method="post">
                        <input type="hidden" id="idPromocion" name="idPromocion">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                <i class="fas fa-tag"></i> Nombre de la Promoción *
                            </label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   required maxlength="100" placeholder="Ej: Cyber Wow Noviembre">
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">
                                <i class="fas fa-align-left"></i> Descripción
                            </label>
                            <textarea class="form-control" id="descripcion" name="descripcion" 
                                      rows="2" maxlength="500" 
                                      placeholder="Descripción de la promoción"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="tipoPromocion" class="form-label">
                                    <i class="fas fa-percent"></i> Tipo de Promoción *
                                </label>
                                <select class="form-select" id="tipoPromocion" name="tipoPromocion" 
                                        required onchange="toggleDescuento()">
                                    <option value="">Seleccione...</option>
                                    <option value="PORCENTAJE">Descuento Porcentaje</option>
                                    <option value="MONTO_FIJO">Descuento Monto Fijo</option>
                                    <option value="2X1">2 por 1</option>
                                    <option value="3X2">3 por 2</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3" id="descuentoGroup">
                                <label for="descuento" class="form-label">
                                    <i class="fas fa-dollar-sign"></i> Descuento
                                </label>
                                <input type="number" class="form-control" id="descuento" name="descuento" 
                                       step="0.01" min="0" placeholder="Ej: 15">
                                <small class="text-muted" id="descuentoHelp">% o S/ según el tipo</small>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fechaInicio" class="form-label">
                                    <i class="fas fa-calendar-alt"></i> Fecha Inicio *
                                </label>
                                <input type="date" class="form-control" id="fechaInicio" name="fechaInicio" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="fechaFin" class="form-label">
                                    <i class="fas fa-calendar-alt"></i> Fecha Fin *
                                </label>
                                <input type="date" class="form-control" id="fechaFin" name="fechaFin" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-box"></i> Productos Aplicables
                            </label>
                            <select class="form-select" id="productosPromocion" name="productosIds" multiple size="6">
                                <option th:each="prod : ${productos}" 
                                        th:value="${prod.idProducto}"
                                        th:text="${prod.nombre + ' - S/ ' + #numbers.formatDecimal(prod.precio, 1, 2)}">
                                </option>
                            </select>
                            <small class="text-muted">Mantén presionado Ctrl/Cmd para seleccionar múltiples</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button id="btnGuardarPromocion" type="submit" form="formPromocion" class="btn btn-primary-custom">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">/*<![CDATA[*/ window.PROMOCIONES_DATA = /*[[${promociones}]]*/ []; window.PRODUCTOS_DATA = /*[[${productos}]]*/ []; /*]]>*/</script>
        <script th:src="@{/js/promociones.js}"></script>
    </div>
    </div>
</div>
