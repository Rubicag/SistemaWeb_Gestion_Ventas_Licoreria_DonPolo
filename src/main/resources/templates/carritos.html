<div th:replace="~{fragments/layout :: base(title='Carritos', active='carritos')}">
  <div th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/carritos.css}" />

    <div class="container-fluid">
      <h1><i class="fas fa-shopping-cart"></i> Gestión de Carritos de Compra</h1>

      <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert"><i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span> <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span> <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

      <div class="acciones-header">
        <button class="btn btn-primary-custom" onclick="nuevoCarrito()"><i class="fas fa-plus"></i> Nuevo Carrito</button>
        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="buscar" class="form-control" placeholder="Buscar por ID, usuario, estado..." onkeyup="filtrarTabla()"></div>
      </div>

      <div class="table-container">
        <table class="table table-hover" id="tablaCarritos">
          <thead><tr><th>ID</th><th>Usuario</th><th>Correo</th><th>Fecha Creación</th><th>Estado</th><th>Items</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="carrito : ${carritos}">
              <td th:text="${carrito.idCarrito}"></td>
              <td th:text="${carrito.usuario != null ? carrito.usuario.nombre : 'Sin usuario'}"></td>
              <td th:text="${carrito.usuario != null ? carrito.usuario.correo : 'Sin correo'}"></td>
              <td th:text="${#temporals.format(carrito.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
              <td><span th:class="'badge ' + (${carrito.estado} == 'ACTIVO' ? 'bg-success' : 'bg-secondary')" th:text="${carrito.estado}"></span></td>
              <td><span class="badge bg-info" th:text="${carrito.detalles != null ? carrito.detalles.size() : 0}"></span></td>
              <td>
                <button class="btn btn-sm btn-info btn-action btn-sm-custom" onclick="verDetalle([[${carrito.idCarrito}]])" title="Ver detalle"><i class="fas fa-eye"></i></button>
                <button class="btn btn-sm btn-primary btn-action btn-sm-custom" th:if="${carrito.estado == 'ACTIVO'}" onclick="agregarProducto([[${carrito.idCarrito}]])" title="Agregar producto"><i class="fas fa-plus"></i></button>
                <button class="btn btn-sm btn-success btn-action btn-sm-custom" th:if="${carrito.estado == 'ACTIVO' && carrito.detalles != null && !carrito.detalles.isEmpty()}" onclick="convertirAVenta([[${carrito.idCarrito}]])" title="Convertir a venta"><i class="fas fa-cash-register"></i></button>
                <button class="btn btn-sm btn-warning btn-action btn-sm-custom" onclick="cambiarEstado([[${carrito.idCarrito}]])" title="Cambiar estado"><i class="fas fa-exchange-alt"></i></button>
                <button class="btn btn-sm btn-danger btn-action btn-sm-custom" th:if="${carrito.detalles != null && !carrito.detalles.isEmpty()}" onclick="vaciarCarrito([[${carrito.idCarrito}]])" title="Vaciar carrito"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(carritos)}"><td colspan="7" class="text-center text-muted"><i class="fas fa-shopping-cart fa-2x mb-2"></i><p>No hay carritos registrados</p></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modales (mantener en la vista) -->
    <div class="modal fade" id="modalCarrito" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="fas fa-shopping-cart"></i> Nuevo Carrito</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><form id="formCarrito" th:action="@{/carritos/guardar}" method="post"><div class="modal-body"><div class="mb-3"><label for="usuario" class="form-label"><i class="fas fa-user"></i> Usuario *</label><select class="form-select" id="usuario" name="usuario.idUsuario" required><option value="">Seleccione un usuario</option><option th:each="usuario : ${usuarios}" th:value="${usuario.idUsuario}" th:text="${usuario.nombre + ' (' + usuario.correo + ')'}"></option></select></div><div class="mb-3"><label for="estado" class="form-label"><i class="fas fa-flag"></i> Estado *</label><select class="form-select" id="estado" name="estado" required><option value="ACTIVO" selected>ACTIVO</option><option value="INACTIVO">INACTIVO</option></select></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Cancelar</button><button type="submit" class="btn btn-primary-custom"><i class="fas fa-save"></i> Crear Carrito</button></div></form></div></div></div>

    <div class="modal fade" id="modalDetalle" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="fas fa-info-circle"></i> Detalle del Carrito</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row mb-3"><div class="col-md-6"><p><strong>ID Carrito:</strong> <span id="detIdCarrito"></span></p><p><strong>Usuario:</strong> <span id="detUsuario"></span></p><p><strong>Correo:</strong> <span id="detCorreo"></span></p></div><div class="col-md-6"><p><strong>Fecha Creación:</strong> <span id="detFechaCreacion"></span></p><p><strong>Estado:</strong> <span id="detEstado"></span></p></div></div><h6 class="mt-4 mb-3"><i class="fas fa-box"></i> Productos en el Carrito</h6><div class="carrito-items" id="detallesCarrito"></div><div class="mt-3 text-end"><h5><strong>Total Items:</strong> <span id="totalItems" class="text-primary">0</span></h5></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>

    <div class="modal fade" id="modalAgregarProducto" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="fas fa-plus"></i> Agregar Producto al Carrito</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><form id="formAgregarProducto" th:action="@{/carritos/agregarProducto}" method="post"><div class="modal-body"><input type="hidden" id="idCarritoProducto" name="idCarrito"><div class="mb-3"><label for="producto" class="form-label"><i class="fas fa-box"></i> Producto *</label><select class="form-select" id="producto" name="idProducto" required><option value="">Seleccione un producto</option><option th:each="producto : ${productos}" th:value="${producto.idProducto}" th:text="${producto.nombre + ' - S/ ' + producto.precio + ' (Stock: ' + producto.stock + ')'}"></option></select></div><div class="mb-3"><label for="cantidad" class="form-label"><i class="fas fa-sort-numeric-up"></i> Cantidad *</label><input type="number" class="form-control" id="cantidad" name="cantidad" min="1" value="1" required></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Cancelar</button><button type="submit" class="btn btn-primary-custom"><i class="fas fa-cart-plus"></i> Agregar</button></div></form></div></div></div>

    <script th:inline="javascript">/*<![CDATA[*/ window.CARRITOS_DATA = /*[[${carritos}]]*/ []; /*]]>*/</script>
    <script th:src="@{/js/carritos.js}"></script>
  </div>
</div>
