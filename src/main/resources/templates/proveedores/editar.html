<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Editar Proveedor - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/proveedores.css}" href="/css/proveedores.css" />
    <style>
        .proveedor-form-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 440px;
            margin: 60px auto 0 auto;
            padding: 44px 32px 32px 32px;
            position: relative;
            text-align: center;
        }
        .proveedor-form-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .proveedor-form-hero form {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .proveedor-form-hero label {
            font-weight: 500;
            color: #a05a2c;
            margin-bottom: 4px;
            text-align: left;
        }
        .proveedor-form-hero input[type="text"],
        .proveedor-form-hero input[type="email"],
        .proveedor-form-hero input[type="tel"],
        .proveedor-form-hero select {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e09f3e;
            font-size: 1rem;
            background: #fff;
            margin-bottom: 8px;
        }
        .proveedor-form-hero button.primary {
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .proveedor-form-hero button.primary:hover {
            background: #e09f3e;
        }
        .proveedor-form-hero .error {
            color: #d32f2f;
            background: #fff0f0;
            border-radius: 4px;
            padding: 8px 0;
            margin-top: 8px;
            font-size: 0.98rem;
        }
        .proveedor-form-hero .help {
            margin-top: 18px;
            font-size: 1rem;
        }
        .proveedor-form-hero .help a {
            color: #e09f3e;
            text-decoration: underline;
            font-weight: 500;
        }
        .proveedor-form-hero .icon {
            font-size: 2.2rem;
            color: #e09f3e;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</th:block>

<th:block th:fragment="content">
    <section>
        <div class="proveedor-form-hero">
            <span class="icon">✏️</span>
            <h2>Editar Proveedor</h2>
            <form th:action="@{/proveedores/actualizar}" th:object="${proveedor}" method="post">
                <input type="hidden" th:field="*{idProveedor}" />

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required />
                <div th:if="${#fields.hasErrors('nombre')}" class="error">* <span th:errors="*{nombre}"></span></div>

                <label for="contacto">Contacto:</label>
                <input type="text" id="contacto" th:field="*{contacto}" required />
                <div th:if="${#fields.hasErrors('contacto')}" class="error">* <span th:errors="*{contacto}"></span></div>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" th:field="*{telefono}" required />
                <div th:if="${#fields.hasErrors('telefono')}" class="error">* <span th:errors="*{telefono}"></span></div>

                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required />
                <div th:if="${#fields.hasErrors('email')}" class="error">* <span th:errors="*{email}"></span></div>

                <label for="estado">Estado:</label>
                <select id="estado" th:field="*{estado}" required>
                    <option value="" disabled>Seleccione estado</option>
                    <option value="ACTIVO">Activo</option>
                    <option value="INACTIVO">Inactivo</option>
                </select>
                <div th:if="${#fields.hasErrors('estado')}" class="error">* <span th:errors="*{estado}"></span></div>

                <button type="submit" class="primary">Actualizar</button>
            </form>

            <div class="help">
                <a th:href="@{/proveedores/listar}" class="small-link">Volver a la lista</a>
            </div>
        </div>
    </section>
</th:block>

</html>
