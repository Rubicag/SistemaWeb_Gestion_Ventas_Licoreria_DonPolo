<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
<section>
    <style>
        .welcome-hero {
            background: linear-gradient(120deg, #f7c873 0%, #e09f3e 100%);
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 650px;
            margin: 60px auto 0 auto;
            padding: 56px 36px 40px 36px;
            text-align: center;
            position: relative;
        }
        .welcome-hero h2 {
            color: #a05a2c;
            font-size: 2.3rem;
            margin-bottom: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .welcome-hero p {
            color: #5a3c1a;
            font-size: 1.18rem;
            margin-bottom: 18px;
        }
        .welcome-hero .icon {
            font-size: 3.5rem;
            color: #e09f3e;
            margin-bottom: 18px;
            display: block;
        }
        .welcome-hero .cta-btn {
            margin-top: 18px;
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .welcome-hero .cta-btn:hover {
            background: #e09f3e;
            color: #fff;
        }
        @media (max-width: 700px) {
            .welcome-hero { padding: 32px 8px; }
            .welcome-hero h2 { font-size: 1.3rem; }
        }
    </style>

    <div class="welcome-hero">
        <span class="icon">🍷</span>
        <h2>Bienvenido al Sistema de Gestión de Ventas<br>Licorería DonPolo</h2>
        <p>
            Gestiona productos, ventas, clientes y reportes de manera profesional.<br>
            Selecciona una opción del menú para comenzar.
        </p>
        <a th:href="@{/productos/listar}" class="cta-btn">Ver productos</a>
    </div>
</section>
</html>
