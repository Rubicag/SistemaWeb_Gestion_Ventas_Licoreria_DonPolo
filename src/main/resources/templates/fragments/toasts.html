<!-- Fragmento: contenedor de toasts y helper showToast -->
<div th:fragment="toasts">
  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3 toast-fixed-high"></div>
  <script>
    function showToast(message, variant, delay) {
      variant = variant || 'primary';
      delay = delay || 4000;
      const id = 'toast-' + Date.now();
      const container = document.getElementById('toastContainer');
      if (!container) {
        console.warn('toastContainer no encontrado');
        alert(message);
        return;
      }
      const toastEl = document.createElement('div');
      toastEl.className = 'toast align-items-center text-bg-' + variant + ' border-0';
      toastEl.role = 'alert';
      toastEl.ariaLive = 'assertive';
      toastEl.ariaAtomic = 'true';
      toastEl.id = id;
      toastEl.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>`;
      container.appendChild(toastEl);
      const toast = new bootstrap.Toast(toastEl, { delay: delay });
      toast.show();
      setTimeout(() => { try { toast.dispose(); toastEl.remove(); } catch(e){} }, delay + 500);
    }
  </script>
</div>
