<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">

<head>
    <title>Nuevo Reporte - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/reportes.css}" href="/css/reportes.css" />
    <style>
        .form-group label {
            font-weight: 600;
            color: #a05a2c;
        }

        .form-group select,
        .form-group input[type="date"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #e09f3e99;
            margin-top: 4px;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-primary {
            background: #e09f3e;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #a05a2c;
        }

        .btn-secondary {
            background: #fff6e6ee;
            color: #a05a2c;
            border: 1px solid #e09f3e99;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #e09f3e;
            color: #fff;
        }
    </style>
</head>

<th:block th:fragment="content">
    <section>
        <div class="container">
            <div class="card" style="max-width: 480px; margin: 0 auto;">
                <h2 style="color: #a05a2c;">Generar Nuevo Reporte</h2>
                <form th:action="@{/reportes/guardar}" th:object="${reporte}" method="post" class="form">
                    <div class="form-group">
                        <label for="tipo">Tipo de Reporte:</label>
                        <select id="tipo" th:field="*{tipo}" required>
                            <option value="" disabled selected>Seleccione tipo</option>
                            <option value="INVENTARIO">Inventario</option>
                            <option value="PRODUCTOS_MAS_VENDIDOS">Productos Más Vendidos</option>
                            <option value="PAGOS">Pagos</option>
                            <option value="PEDIDOS">Pedidos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" th:field="*{fecha}" required />
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario:</label>
                        <select id="usuario" th:field="*{usuario}" required>
                            <option value="" disabled selected>Seleccione usuario</option>
                            <option th:each="usuario : ${usuarios}"
                                    th:value="${usuario.idUsuario}"
                                    th:text="${usuario.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Generar Reporte</button>
                        <a th:href="@{/reportes/listar}" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</th:block>

</html>
