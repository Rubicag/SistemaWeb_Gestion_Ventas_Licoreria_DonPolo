<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Detalle Reporte - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/reportes.css}" href="/css/reportes.css" />
    <style>
        .detail-group {
            margin-bottom: 1.2rem;
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .detail-group label {
            font-weight: 600;
            color: #a05a2c;
            min-width: 120px;
        }

        .detail-group span {
            color: #333;
            font-size: 1.08rem;
        }

        .btn-secondary {
            background: #fff6e6ee;
            color: #a05a2c;
            border: 1px solid #e09f3e99;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #e09f3e;
            color: #fff;
        }
    </style>
</head>

<!-- ... -->
    <section>
        <div class="container">
            <div class="card" style="max-width: 480px; margin: 0 auto;">
                <h2 style="color: #a05a2c;">Detalle del Reporte</h2>

                <div class="detail-group">
                    <label>ID Reporte:</label>
                    <span th:text="${reporte.idReporte}"></span>
                </div>

                <div class="detail-group">
                    <label>Tipo:</label>
                    <span th:text="${reporte.tipo}"></span>
                </div>

                <div class="detail-group">
                    <label>Fecha:</label>
                    <span th:text="${#dates.format(reporte.fecha, 'dd/MM/yyyy')}"></span>
                </div>

                <div class="detail-group">
                    <label>Usuario:</label>
                    <span th:text="${reporte.usuario.nombre}"></span>
                </div>

                <div class="form-actions" style="margin-top: 24px;">
                    <a th:href="@{/reportes/listar}" class="btn-secondary">Volver a Reportes</a>
                </div>
            </div>
        </div>
    </section>
</th:block>

</html>
