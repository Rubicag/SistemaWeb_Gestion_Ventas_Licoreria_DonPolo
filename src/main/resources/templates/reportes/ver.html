<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Reporte - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="brand">
                <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                Licorería DonPolo
            </div>
            <nav class="menu">
                <a th:href="@{/productos/listar}">Productos</a>
                <a th:href="@{/ventas/listar}">Ventas</a>
                <a th:href="@{/clientes/listar}">Clientes</a>
                <a th:href="@{/proveedores/listar}">Proveedores</a>
                <a th:href="@{/ventas/carrito}">Carritos</a>
                <a th:href="@{/reportes/listar}">Reportes</a>
                <a th:href="@{/home}">Inicio</a>
            </nav>
        </div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="card">
                <h2>Detalle del Reporte</h2>
                <div class="detail-group">
                    <label>ID Reporte:</label>
                    <span th:text="${reporte.idReporte}"></span>
                </div>
                <div class="detail-group">
                    <label>Tipo:</label>
                    <span th:text="${reporte.tipo}"></span>
                </div>
                <div class="detail-group">
                    <label>Fecha:</label>
                    <span th:text="${reporte.fecha}"></span>
                </div>
                <div class="detail-group">
                    <label>Usuario:</label>
                    <span th:text="${reporte.usuario.nombre}"></span>
                </div>
                <div class="form-actions" style="margin-top: 24px;">
                    <a th:href="@{/reportes/listar}" class="btn btn-secondary">Volver a Reportes</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
