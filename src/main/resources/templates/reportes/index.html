<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="brand">
                <img src="/images/489776759_1445572563416672_585177025224455684_n.jpg" alt="Logo" class="logo" onerror="this.style.display='none'">
                Licorería DonPolo
            </div>
            <nav class="menu">
                <a th:href="@{/productos/listar}">Productos</a>
                <a th:href="@{/ventas/listar}">Ventas</a>
                <a th:href="@{/clientes/listar}">Clientes</a>
                <a th:href="@{/proveedores/listar}">Proveedores</a>
                <a th:href="@{/carritos/listar}">Carritos</a>
                <a th:href="@{/reportes/listar}">Reportes</a>
                <a th:href="@{/home}">Inicio</a>
            </nav>
        </div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="card">
                <h2>Reportes del Sistema</h2>
                <ul class="report-list">
                    <li><a th:href="@{/reportes/inventarios}">Inventarios</a></li>
                    <li><a th:href="@{/reportes/productosMasVendidos}">Productos Más Vendidos</a></li>
                    <li><a th:href="@{/reportes/reportePagos}">Pagos</a></li>
                    <li><a th:href="@{/reportes/reportePedidos}">Pedidos</a></li>
                </ul>
            </div>
        </div>
    </main>
</body>
</html>
