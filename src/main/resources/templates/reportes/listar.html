<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reporte de Ventas por Producto - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            body { background: #f8f6f2; }
            .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.09); padding: 2.5rem; }
            .card-hero h2 { color: #a05a2c; display: flex; align-items: center; gap: 10px; }
            .btn-primary-custom { background: #a05a2c; border-color: #a05a2c; }
            .btn-primary-custom:hover { background: #e09f3e; border-color: #e09f3e; }
            table.table thead th { background: #fff6e6ee; color: #a05a2c; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="card card-hero mx-auto" style="max-width:900px;">
        <div class="card-body">
            <h2 class="mb-4"><i class="fa-solid fa-chart-line me-2"></i> Reporte de Ventas por Producto</h2>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Buscar producto..." oninput="filtrarTabla(this.value)">
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle" id="tablaReportes">
                    <thead>
                        <tr>
                            <th scope="col"><i class="fa-solid fa-tag"></i> Producto</th>
                            <th scope="col"><i class="fa-solid fa-cubes"></i> Cantidad Vendida</th>
                            <th scope="col"><i class="fa-solid fa-dollar-sign"></i> Total Vendido</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${reporteVentas}">
                            <td th:text="${item.nombreProducto}"></td>
                            <td th:text="${item.cantidadVendida}"></td>
                            <td th:text="${item.totalVendido}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<script>
    function filtrarTabla(valor) {
        const tabla = document.getElementById('tablaReportes');
        const filas = tabla.getElementsByTagName('tr');
        for (let i = 1; i < filas.length; i++) {
            const celdas = filas[i].getElementsByTagName('td');
            if (celdas.length > 0) {
                const producto = celdas[0].textContent.toLowerCase();
                filas[i].style.display = producto.includes(valor.toLowerCase()) ? '' : 'none';
            }
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
