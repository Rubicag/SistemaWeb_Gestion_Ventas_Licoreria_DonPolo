<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reporte de Ventas por Producto - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/reportes.css}" href="/css/reportes.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .primary {
            background: #e09f3e;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background 0.2s;
            display: inline-block;
        }
        .primary:hover {
            background: #a05a2c;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
        }
        thead tr {
            background: #fff6e6ee;
            color: #a05a2c;
        }
        tbody tr:nth-child(even) {
            background: #f9f6f2;
        }
        .small-link {
            color: #e09f3e;
            text-decoration: underline;
            font-size: 0.98rem;
        }
        .small-link:hover {
            color: #a05a2c;
        }
        @media (max-width: 900px) {
            .card { padding: 18px 4px; }
        }
        .filter-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 7px 12px;
            border-radius: 5px;
            border: 1px solid #e09f3e99;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <section>
        <div class="container">
            <div class="card">
                <h2><i class="fa-solid fa-chart-line"></i> Reporte de Ventas por Producto</h2>
                <div class="filter-bar">
                    <input type="text" placeholder="Buscar producto..." oninput="filtrarTabla(this.value)">
                </div>
                <div class="table-responsive">
                    <table id="tablaReportes">
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-tag"></i> Producto</th>
                                <th><i class="fa-solid fa-cubes"></i> Cantidad Vendida</th>
                                <th><i class="fa-solid fa-dollar-sign"></i> Total Vendido</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${reporteVentas}">
                                <td th:text="${item.nombreProducto}"></td>
                                <td th:text="${item.cantidadVendida}"></td>
                                <td th:text="${item.totalVendido}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <script>
            function filtrarTabla(valor) {
                const tabla = document.getElementById('tablaReportes');
                const filas = tabla.getElementsByTagName('tr');
                for (let i = 1; i < filas.length; i++) {
                    const celdas = filas[i].getElementsByTagName('td');
                    if (celdas.length > 0) {
                        const producto = celdas[0].textContent.toLowerCase();
                        filas[i].style.display = producto.includes(valor.toLowerCase()) ? '' : 'none';
                    }
                }
            }
        </script>
    </section>
</body>
</html>
