<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Promoción - Licorería Don Polo</title>

    <head>
        <meta charset="UTF-8">
        <title>Registrar Promoción - Licorería Don Polo</title>
        <link rel="stylesheet" th:href="@{/css/promociones.css}" href="/css/promociones.css" />
        <style>
            .card {
                max-width: 600px;
                margin: 40px auto;
                background: #fff6e6ee;
                border-radius: 12px;
                padding: 32px;
                box-shadow: 0 6px 24px rgba(160,90,44,0.15);
            }
            h2 {
                color: #a05a2c;
                text-align: center;
                margin-bottom: 24px;
            }
            .form-row {
                margin-bottom: 16px;
                display: flex;
                flex-direction: column;
            }
            label {
                font-weight: 600;
                color: #a05a2c;
                margin-bottom: 6px;
            }
            input {
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #ddd;
                font-size: 1rem;
            }
            .primary {
                background: #e09f3e;
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 10px 18px;
                font-size: 1.08rem;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.2s;
                display: inline-block;
            }
            .primary:hover {
                background: #a05a2c;
            }
            .small-link {
                color: #e09f3e;
                text-decoration: underline;
                font-size: 1rem;
            }
            .small-link:hover {
                color: #a05a2c;
            }
            .error {
                color: #d32f2f;
                font-size: 0.9rem;
            }
        </style>
    </head>

    <!-- CSS específico -->
    <link rel="stylesheet" th:href="@{/css/promociones.css}" href="/css/promociones.css" />

    <style>
        .card {
            max-width: 600px;
            margin: 40px auto;
            background: #fff6e6ee;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 6px 24px rgba(160,90,44,0.15);
        }
        h2 {
            color: #a05a2c;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            color: #a05a2c;
            margin-bottom: 6px;
        }
        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        .primary {
            background: #e09f3e;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
        }
        .primary:hover {
            background: #a05a2c;
        }
        .small-link {
            color: #e09f3e;
            text-decoration: underline;
            font-size: 1rem;
        }
        .small-link:hover {
            color: #a05a2c;
        }
        .error {
            color: #d32f2f;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- ... -->

    <!-- Contenido principal -->
    <section>
        <div class="card">
            <h2>Registrar Nueva Promoción</h2>
            <form th:action="@{/promociones/guardar}" th:object="${promocion}" method="post">
                
                <div class="form-row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required />
                    <div th:if="${#fields.hasErrors('nombre')}" class="error">
                        * <span th:errors="*{nombre}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" th:field="*{descripcion}" required />
                    <div th:if="${#fields.hasErrors('descripcion')}" class="error">
                        * <span th:errors="*{descripcion}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="descuento">Descuento (%):</label>
                    <input type="number" id="descuento" th:field="*{descuento}" min="0" max="100" required />
                    <div th:if="${#fields.hasErrors('descuento')}" class="error">
                        * <span th:errors="*{descuento}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="fechaInicio">Fecha Inicio:</label>
                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" required />
                    <div th:if="${#fields.hasErrors('fechaInicio')}" class="error">
                        * <span th:errors="*{fechaInicio}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="fechaFin">Fecha Fin:</label>
                    <input type="date" id="fechaFin" th:field="*{fechaFin}" required />
                    <div th:if="${#fields.hasErrors('fechaFin')}" class="error">
                        * <span th:errors="*{fechaFin}"></span>
                    </div>
                </div>

                <button type="submit" class="primary">Guardar</button>
                <a th:href="@{/promociones}" class="small-link" style="margin-left:1rem;">Cancelar</a>
            </form>
        </div>
    </section>

    <!-- Pie de página -->
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
