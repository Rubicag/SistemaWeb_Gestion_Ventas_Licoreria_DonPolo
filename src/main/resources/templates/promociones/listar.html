<!-- Vista para listar promociones, compatible con el controlador -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Promociones</title>
</head>
<body>
    <h2>Promociones</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Descuento</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="promocion : ${promociones}">
                <td th:text="${promocion.idPromocion}"></td>
                <td th:text="${promocion.descripcion}"></td>
                <td th:text="${promocion.descuento}"></td>
                <td th:text="${promocion.fechaInicio}"></td>
                <td th:text="${promocion.fechaFin}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
