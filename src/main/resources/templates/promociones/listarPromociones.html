<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado de Promociones - Licorería Don Polo</title>

    <head>
        <meta charset="UTF-8">
        <title>Listado de Promociones - Licorería Don Polo</title>
        <link rel="stylesheet" th:href="@{/css/promociones.css}" href="/css/promociones.css" />
        <style>
            .primary {
                background: #e09f3e;
                color: #fff;
                border: none;
                border-radius: 5px;
                padding: 10px 18px;
                font-size: 1.08rem;
                font-weight: bold;
                cursor: pointer;
                margin-bottom: 1rem;
                transition: background 0.2s;
                display: inline-block;
            }
            .primary:hover {
                background: #a05a2c;
            }
            h2 {
                color: #a05a2c;
                margin-top: 2rem;
                text-align: center;
            }
            .table-responsive {
                overflow-x: auto;
                margin: 20px auto;
                max-width: 900px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            }
            th, td {
                padding: 12px 10px;
                text-align: left;
            }
            thead tr {
                background: #fff6e6ee;
                color: #a05a2c;
            }
            tbody tr:nth-child(even) {
                background: #f9f6f2;
            }
            .small-link {
                color: #e09f3e;
                text-decoration: underline;
                font-size: 0.98rem;
            }
            .small-link:hover {
                color: #a05a2c;
            }
            @media (max-width: 900px) {
                .card { padding: 18px 4px; }
            }
        </style>
    </head>

    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/promociones.css}" href="/css/promociones.css" />

    <style>
        .primary {
            background: #e09f3e;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background 0.2s;
            display: inline-block;
        }
        .primary:hover {
            background: #a05a2c;
        }
        h2 {
            color: #a05a2c;
            margin-top: 2rem;
            text-align: center;
        }
        .table-responsive {
            overflow-x: auto;
            margin: 20px auto;
            max-width: 900px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
        }
        thead tr {
            background: #fff6e6ee;
            color: #a05a2c;
        }
        tbody tr:nth-child(even) {
            background: #f9f6f2;
        }
        .small-link {
            color: #e09f3e;
            text-decoration: underline;
            font-size: 0.98rem;
        }
        .small-link:hover {
            color: #a05a2c;
        }
        @media (max-width: 900px) {
            .card { padding: 18px 4px; }
        }
    </style>
</head>

<body>
    <!-- ... -->

    <!-- Contenido principal -->
    <section>
        <div class="container">
            <h2>Listado de Promociones</h2>

            <div style="text-align: center; margin-bottom: 1rem;">
                <a th:href="@{/promociones/nueva}" class="primary">Registrar Nueva Promoción</a>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descuento</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${promociones}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td th:text="${p.descuento + '%'}"></td>
                            <td>
                                <a th:href="@{'/promociones/editar/' + ${p.id}}" class="small-link">Editar</a>
                                <a th:href="@{'/promociones/eliminar/' + ${p.id}}"
                                   class="small-link"
                                   style="color:#d32f2f;margin-left:8px;"
                                   onclick="return confirm('¿Eliminar promoción?');">
                                   Eliminar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(promociones)}">
                            <td colspan="4" style="text-align:center;color:#999;">No hay promociones registradas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Pie de página -->
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
