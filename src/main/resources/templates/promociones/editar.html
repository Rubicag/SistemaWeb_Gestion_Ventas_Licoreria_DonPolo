<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Promoción - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <header>
        <div class="brand">
            <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            Licorería DonPolo
        </div>
        <nav class="menu">
            <a th:href="@{/productos}">Productos</a>
            <a th:href="@{/ventas}">Ventas</a>
            <a th:href="@{/clientes}">Clientes</a>
            <a th:href="@{/proveedores}">Proveedores</a>
            <a th:href="@{/carritos}">Carritos</a>
            <a th:href="@{/reportes}">Reportes</a>
            <a th:href="@{/}">Inicio</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="card">
            <h2>Editar Promoción</h2>
            <form th:action="@{/promociones/actualizar}" th:object="${promocion}" method="post">
                <input type="hidden" th:field="*{idPromocion}" />
                <div class="form-row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required />
                </div>
                <div class="form-row">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" th:field="*{descripcion}" required />
                </div>
                <div class="form-row">
                    <label for="descuento">Descuento (%):</label>
                    <input type="number" id="descuento" th:field="*{descuento}" min="0" max="100" required />
                </div>
                <div class="form-row">
                    <label for="fechaInicio">Fecha Inicio:</label>
                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" required />
                </div>
                <div class="form-row">
                    <label for="fechaFin">Fecha Fin:</label>
                    <input type="date" id="fechaFin" th:field="*{fechaFin}" required />
                </div>
                <button type="submit" class="primary">Actualizar</button>
                <a th:href="@{/promociones}" class="small-link" style="margin-left:1rem;">Cancelar</a>
            </form>
        </div>
    </main>
</body>
</html>
