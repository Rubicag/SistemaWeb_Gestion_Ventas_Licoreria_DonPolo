<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
<head>
    <title>Editar Promoción - Licorería Don Polo</title>

    <!-- Importa el head del layout -->
    <th:block th:replace="~{layout :: head}"></th:block>

    <!-- CSS propio de la vista -->
    <link rel="stylesheet" th:href="@{/css/promociones.css}" href="/css/promociones.css" />
    <style>
        .card {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 600px;
            margin: 70px auto;
            padding: 40px;
        }
        h2 {
            text-align: center;
            color: #a05a2c;
            margin-bottom: 25px;
        }
        .form-row {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #5d4037;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d7ccc8;
            border-radius: 6px;
            font-size: 1rem;
        }
        button.primary {
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: background 0.2s;
        }
        button.primary:hover {
            background: #e09f3e;
        }
        .small-link {
            color: #a05a2c;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .small-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Cabecera global -->
    <div th:replace="~{layout :: header}"></div>

    <!-- Contenido de la vista -->
    <section>
        <div class="card">
            <h2>Editar Promoción</h2>
            <form th:action="@{/promociones/actualizar}" th:object="${promocion}" method="post">
                <input type="hidden" th:field="*{idPromocion}" />

                <div class="form-row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required />
                    <div th:if="${#fields.hasErrors('nombre')}" class="error">* <span th:errors="*{nombre}"></span></div>
                </div>

                <div class="form-row">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" th:field="*{descripcion}" required />
                    <div th:if="${#fields.hasErrors('descripcion')}" class="error">* <span th:errors="*{descripcion}"></span></div>
                </div>

                <div class="form-row">
                    <label for="descuento">Descuento (%):</label>
                    <input type="number" id="descuento" th:field="*{descuento}" min="0" max="100" required />
                    <div th:if="${#fields.hasErrors('descuento')}" class="error">* <span th:errors="*{descuento}"></span></div>
                </div>

                <div class="form-row">
                    <label for="fechaInicio">Fecha Inicio:</label>
                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" required />
                    <div th:if="${#fields.hasErrors('fechaInicio')}" class="error">* <span th:errors="*{fechaInicio}"></span></div>
                </div>

                <div class="form-row">
                    <label for="fechaFin">Fecha Fin:</label>
                    <input type="date" id="fechaFin" th:field="*{fechaFin}" required />
                    <div th:if="${#fields.hasErrors('fechaFin')}" class="error">* <span th:errors="*{fechaFin}"></span></div>
                </div>

                <button type="submit" class="primary">Actualizar</button>
                <a th:href="@{/promociones}" class="small-link" style="margin-left:1rem;">Cancelar</a>
            </form>
        </div>
    </section>

    <!-- Pie global -->
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
