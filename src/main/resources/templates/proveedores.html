<div th:replace="~{fragments/layout :: base(title='Proveedores', active='proveedores')}">
    <div th:fragment="head">
        <link rel="stylesheet" th:href="@{/css/proveedores.css}" />
    </div>
    <div th:fragment="content">
            <div class="container-main">
        <!-- Alertas Modernas -->
        <div th:if="${mensaje}" class="alert alert-modern alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-modern alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Card Principal Moderna -->
        <div class="modern-card">
            <div class="modern-card-header">
                <h3><i class="fas fa-truck me-2"></i>Gestión de Proveedores</h3>
                <button onclick="nuevoProveedor()" class="btn btn-modern-primary">
                    <i class="fas fa-plus-circle me-2"></i>Nuevo Proveedor
                </button>
            </div>

            <div class="modern-card-body">
                <!-- Búsqueda Moderna -->
                <div class="search-box-modern mb-4">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscarProveedor" class="form-control" 
                           placeholder="Buscar por nombre, RUC, teléfono..." onkeyup="filtrarTabla()">
                </div>

                <!-- Tabla Moderna -->
                <div class="table-responsive">
                    <table class="table table-modern" id="tablaProveedores">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre/Razón Social</th>
                        <th>RUC</th>
                        <th>Contacto</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="proveedor : ${proveedores}">
                        <td><span class="badge badge-modern-secondary" th:text="${proveedor.idProveedor}">1</span></td>
                        <td>
                            <div class="proveedor-icon">
                                <i class="fas fa-truck"></i>
                            </div>
                            <strong th:text="${proveedor.nombre}">Distribuidora XYZ</strong>
                        </td>
                        <td><i class="fas fa-id-card me-2 icon-secondary"></i><span th:text="${proveedor.ruc}">20123456789</span></td>
                        <td>
                            <div th:if="${proveedor.telefono}">
                                <i class="fas fa-phone me-1 icon-accent-blue"></i> <span th:text="${proveedor.telefono}">987654321</span>
                            </div>
                            <div th:if="${proveedor.email}">
                                <i class="fas fa-envelope me-1 icon-secondary"></i> <span th:text="${proveedor.email}">proveedor@email.com</span>
                            </div>
                        </td>
                        <td th:text="${proveedor.direccion}">Av. Principal 123</td>
                        <td>
                            <span class="badge" th:classappend="${proveedor.activo} ? 'badge-modern-success' : 'badge-modern-secondary'"
                                  th:text="${proveedor.activo ? 'Activo' : 'Inactivo'}">Activo</span>
                        </td>
                        <td>
                            <div class="btn-group" role="group">
                                <button class="btn btn-modern-warning btn-sm btn-editar-proveedor" 
                                        th:data-proveedor-id="${proveedor.idProveedor}"
                                        title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button th:if="${proveedor.activo}" 
                                        class="btn btn-modern-danger btn-sm btn-cambiar-estado"
                                        th:data-proveedor-id="${proveedor.idProveedor}"
                                        data-estado="false"
                                        title="Desactivar">
                                    <i class="fas fa-ban"></i>
                                </button>
                                <button th:unless="${proveedor.activo}" 
                                        class="btn btn-modern-success btn-sm btn-cambiar-estado"
                                        th:data-proveedor-id="${proveedor.idProveedor}"
                                        data-estado="true"
                                        title="Activar">
                                    <i class="fas fa-check"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(proveedores)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-truck fa-3x mb-3 opacity-25"></i><br>
                            <span class="text-large">No hay proveedores registrados</span><br>
                            <small class="text-muted">Agrega tu primer proveedor para empezar</small>
                        </td>
                    </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Proveedor -->
    <div class="modal fade" id="modalProveedor" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-modern">
                <div class="modal-header modal-header-modern">
                    <h5 class="modal-title"><i class="fas fa-truck"></i> <span id="modalTitulo">Nuevo Proveedor</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProveedor" method="post">
                        <input type="hidden" id="idProveedor" name="idProveedor">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                <i class="fas fa-building"></i> Nombre / Razón Social *
                            </label>
                            <input type="text" class="form-control form-modern" id="nombre" name="nombre" 
                                   required maxlength="100" placeholder="Distribuidora ABC SAC">
                        </div>

                        <div class="mb-3">
                            <label for="ruc" class="form-label">
                                <i class="fas fa-id-card"></i> RUC *
                            </label>
                            <input type="text" class="form-control form-modern" id="ruc" name="ruc" 
                                   required pattern="[0-9]{11}" maxlength="11" 
                                   placeholder="20123456789">
                            <small class="text-muted">11 dígitos</small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">
                                    <i class="fas fa-phone"></i> Teléfono
                                </label>
                                <input type="tel" class="form-control form-modern" id="telefono" name="telefono" 
                                       maxlength="15" placeholder="987654321">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="correo" class="form-label">
                                    <i class="fas fa-envelope"></i> Correo
                                </label>
                                <input type="email" class="form-control form-modern" id="correo" name="correo" 
                                       maxlength="100" placeholder="proveedor@email.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">
                                <i class="fas fa-map-marker-alt"></i> Dirección
                            </label>
                            <textarea class="form-control form-modern" id="direccion" name="direccion" 
                                      rows="2" maxlength="200" placeholder="Av. Principal 123, Distrito"></textarea>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="activo" name="activo" checked>
                            <label class="form-check-label" for="activo">
                                Proveedor Activo
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-modern-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" form="formProveedor" class="btn btn-modern-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">/*<![CDATA[*/ window.PROVEEDORES_DATA = /*[[${proveedores}]]*/ []; /*]]>*/</script>
        <script th:src="@{/js/proveedores.js}"></script>
    </div>
        </div>
    </div>
