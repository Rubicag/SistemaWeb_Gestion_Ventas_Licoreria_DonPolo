<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}" href="/css/registro.css" />
    <style>
        .register-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 440px;
            margin: 60px auto 0 auto;
            padding: 44px 32px 32px 32px;
            text-align: center;
            position: relative;
        }
        .register-hero .logo {
            margin-bottom: 18px;
        }
        .register-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .register-hero form {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .register-hero label {
            font-weight: 500;
            color: #a05a2c;
            margin-bottom: 4px;
            text-align: left;
        }
        .register-hero input[type="text"],
        .register-hero input[type="email"],
        .register-hero input[type="password"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e09f3e;
            font-size: 1rem;
            background: #fff;
            margin-bottom: 8px;
        }
        .register-hero button.primary {
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .register-hero button.primary:hover {
            background: #e09f3e;
        }
        .register-hero .error {
            color: #d32f2f;
            background: #fff0f0;
            border-radius: 4px;
            padding: 8px 0;
            margin-top: 8px;
            font-size: 0.98rem;
        }
        .register-hero .success {
            color: #388e3c;
            background: #e8f5e9;
            border-radius: 4px;
            padding: 8px 0;
            margin-top: 8px;
            font-size: 0.98rem;
        }
        .register-hero .help {
            margin-top: 18px;
            font-size: 1rem;
        }
        .register-hero .help a {
            color: #e09f3e;
            text-decoration: underline;
            font-weight: 500;
        }
        .register-hero .icon {
            font-size: 2.2rem;
            color: #e09f3e;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>

<body>
    <section>
        <div class="register-hero">
            <span class="icon">📝</span>
            <div class="logo">
                <img th:src="@{/images/489776759_1445572563416672_585177025224455684_n.jpg}" 
                     src="/images/489776759_1445572563416672_585177025224455684_n.jpg" 
                     alt="Logo"
                     style="height:70px;width:70px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:10px;"/>
            </div>
            <h2>Registro de Usuario</h2>
            <form th:action="@{/registro}" method="post">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="usuario@correo.com" required />

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required />

                <button type="submit" class="primary">Registrarse</button>
                <p class="error" th:text="${errorMessage}"></p>
            </form>

            <div class="help">
                ¿Ya tienes cuenta? 
                <a th:href="@{/login}" class="small-link">Inicia sesión aquí</a>
            </div>
        </div>
    </section>
</body>
</html>
