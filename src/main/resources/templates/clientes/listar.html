<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clientes - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}" href="/css/clientes.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .clientes-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 900px;
            margin: 60px auto 0 auto;
            padding: 44px 32px 32px 32px;
            position: relative;
        }
        .clientes-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
            text-align: center;
        }
        .clientes-hero .add-btn {
            display: inline-block;
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 22px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .clientes-hero .add-btn:hover {
            background: #e09f3e;
            color: #fff;
        }
        .clientes-hero .table-responsive {
            overflow-x: auto;
        }
        .clientes-hero table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .clientes-hero th, .clientes-hero td {
            padding: 12px 10px;
            text-align: center;
        }
        .clientes-hero th {
            background: #e09f3e;
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .clientes-hero tr:nth-child(even) {
            background: #fff6e6;
        }
        .clientes-hero tr:hover {
            background: #ffe0b2;
        }
        .clientes-hero .acciones a {
            margin: 0 6px;
            font-size: 1.1rem;
            text-decoration: none;
            color: #a05a2c;
            transition: color 0.2s;
        }
        .clientes-hero .acciones a:hover {
            color: #1976d2;
        }
        .clientes-hero .acciones .icon-edit {
            color: #1976d2;
        }
        .clientes-hero .acciones .icon-delete {
            color: #d32f2f;
        }
    </style>
</head>

<body>
    <section>
        <div class="clientes-hero">
            <h2><i class="fa-solid fa-users"></i> Listado de Clientes</h2>
            <a th:href="@{/clientes/nuevo}" class="add-btn"><i class="fa-solid fa-user-plus"></i> Registrar Nuevo Cliente</a>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fa-solid fa-hashtag"></i> ID</th>
                            <th><i class="fa-solid fa-user"></i> Nombre</th>
                            <th><i class="fa-solid fa-envelope"></i> Correo</th>
                            <th><i class="fa-solid fa-phone"></i> Teléfono</th>
                            <th><i class="fa-solid fa-gear"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.idCliente}"></td>
                            <td th:text="${cliente.nombre}"></td>
                            <td th:text="${cliente.correo}"></td>
                            <td th:text="${cliente.telefono}"></td>
                            <td class="acciones">
                                <a th:href="@{'/clientes/editar/' + ${cliente.idCliente}}" title="Editar" class="icon-edit"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{'/clientes/eliminar/' + ${cliente.idCliente}}" title="Eliminar" class="icon-delete" onclick="return confirm('¿Está seguro de eliminar este cliente?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="5" style="color:#a05a2c;font-weight:500;">No hay clientes registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
