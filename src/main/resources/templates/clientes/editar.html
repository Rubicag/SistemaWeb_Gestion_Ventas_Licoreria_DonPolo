<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <header>
        <div class="brand">
            <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            Licorería DonPolo
        </div>
        <nav class="menu">
            <a th:href="@{/productos/listar}">Productos</a>
            <a th:href="@{/ventas/listar}">Ventas</a>
            <a th:href="@{/clientes/listar}">Clientes</a>
            <a th:href="@{/proveedores/listar}">Proveedores</a>
            <a th:href="@{/ventas/carrito}">Carritos</a>
            <a th:href="@{/reportes/listar}">Reportes</a>
            <a th:href="@{/home}">Inicio</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="card">
            <h2>Editar Cliente</h2>
            <form th:action="@{/clientes/actualizar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{idCliente}" />
                <div class="form-row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required />
                </div>
                <div class="form-row">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" th:field="*{apellido}" required />
                </div>
                <div class="form-row">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" th:field="*{correo}" required />
                </div>
                <div class="form-row">
                    <label for="telefono">Teléfono:</label>
                    <input type="text" id="telefono" th:field="*{telefono}" required />
                </div>
                <button type="submit" class="primary">Actualizar</button>
                <a th:href="@{/clientes/listar}" class="small-link" style="margin-left:1rem;">Cancelar</a>
            </form>
        </div>
    </main>
</body>
