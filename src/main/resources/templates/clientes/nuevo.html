<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Cliente - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}" href="/css/clientes.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .cliente-form-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 440px;
            margin: 60px auto;
            padding: 44px 32px 32px;
            text-align: center;
        }
        .cliente-form-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .cliente-form-hero form {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .cliente-form-hero label {
            font-weight: 500;
            color: #a05a2c;
            text-align: left;
        }
        .cliente-form-hero input[type="text"],
        .cliente-form-hero input[type="email"],
        .cliente-form-hero input[type="tel"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e09f3e;
            font-size: 1rem;
            background: #fff;
        }
        .cliente-form-hero button.primary {
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .cliente-form-hero button.primary:hover {
            background: #e09f3e;
        }
        .cliente-form-hero .error {
            color: #d32f2f;
            background: #fff0f0;
            border-radius: 4px;
            padding: 6px;
            font-size: 0.9rem;
        }
        .cliente-form-hero .help {
            margin-top: 18px;
            font-size: 1rem;
        }
        .cliente-form-hero .help a {
            color: #e09f3e;
            text-decoration: underline;
            font-weight: 500;
        }
        .cliente-form-hero .icon {
            font-size: 2.2rem;
            color: #e09f3e;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>
<section>
    <div class="cliente-form-hero">
        <span class="icon"><i class="fa-solid fa-user-plus"></i></span>
        <h2>Registrar Nuevo Cliente</h2>
        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required />
            <div th:if="${#fields.hasErrors('nombre')}" class="error">
                <span th:errors="*{nombre}"></span>
            </div>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" th:field="*{correo}" required />
            <div th:if="${#fields.hasErrors('correo')}" class="error">
                <span th:errors="*{correo}"></span>
            </div>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" th:field="*{telefono}" required />
            <div th:if="${#fields.hasErrors('telefono')}" class="error">
                <span th:errors="*{telefono}"></span>
            </div>
            <button type="submit" class="primary"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        </form>
        <div class="help">
            <a th:href="@{/clientes/listar}"><i class="fa-solid fa-arrow-left"></i> Volver a la lista</a>
        </div>
    </div>
</section>
</body>
</html>
