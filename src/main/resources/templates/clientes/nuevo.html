<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cliente - Licorería Don Polo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
      body { background: #f8f6f2; }
      .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.09); padding: 2.5rem; max-width: 440px; margin: 60px auto; }
      .card-hero h2 { color: #a05a2c; display: flex; align-items: center; gap: 10px; justify-content: center; }
      .btn-primary-custom { background: #a05a2c; border-color: #a05a2c; }
      .btn-primary-custom:hover { background: #e09f3e; border-color: #e09f3e; }
    </style>
</head>
<body>
<section class="container py-5">
  <div class="card card-hero">
    <h2 class="mb-4"><i class="fa-solid fa-user-plus me-2"></i> Registrar Nuevo Cliente</h2>
    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required />
        <div th:if="${#fields.hasErrors('nombre')}" class="text-danger small"><span th:errors="*{nombre}"></span></div>
      </div>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" id="correo" th:field="*{correo}" class="form-control" required />
        <div th:if="${#fields.hasErrors('correo')}" class="text-danger small"><span th:errors="*{correo}"></span></div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-primary-custom"><i class="fa-solid fa-floppy-disk me-2"></i> Guardar</button>
        <a th:href="@{/clientes/listar}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left me-2"></i> Volver a la lista</a>
      </div>
    </form>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
