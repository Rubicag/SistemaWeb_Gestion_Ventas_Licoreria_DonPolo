<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
    <h1>Notificaciones</h1>
    <div th:if="${notificaciones == null or #lists.isEmpty(notificaciones)}">
        <p>No tienes notificaciones.</p>
    </div>
    <div th:if="${notificaciones != null and !#lists.isEmpty(notificaciones)}">
        <table border="1">
            <thead>
                <tr>
                    <th>Mensaje</th>
                    <th>Fecha</th>
                    <th>Leída</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="n : ${notificaciones}">
                    <td th:text="${n.mensaje}"></td>
                    <td th:text="${#dates.format(n.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${n.leida ? 'Sí' : 'No'}"></td>
                    <td>
                        <span th:if="${!n.leida}">
                            <a th:href="@{'/notificaciones/marcar-leida/' + ${n.id}}">Marcar como leída</a>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div style="margin-top:1em;">
        <a th:href="@{'/notificaciones/crear-ejemplo'}" style="margin-right:1em;">Crear notificación de ejemplo</a>
        <a th:href="@{'/productos/listar'}">Volver a productos</a>
    </div>
</body>
</html>
