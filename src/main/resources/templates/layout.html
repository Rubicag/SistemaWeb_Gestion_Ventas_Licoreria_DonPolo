<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Licorería Don Polo'">Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #f7c873 0%, #e09f3e 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #fff6e6ee;
            box-shadow: 2px 0 12px rgba(0,0,0,0.07);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding-top: 24px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 101;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #a05a2c;
            margin-bottom: 32px;
            padding-left: 18px;
        }
        .sidebar .logo {
            height: 40px;
            margin-right: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .sidebar nav.menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar nav.menu a {
            color: #a05a2c;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.08rem;
            padding: 10px 18px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar nav.menu a:hover, .sidebar nav.menu a.active {
            background: #e09f3e;
            color: #fff;
        }
        .main-wrapper {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #fff6e6ee;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 72px;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .user-area .fa-user-circle {
            font-size: 2rem;
            color: #a05a2c;
        }
        .user-area .username {
            font-weight: 600;
            color: #a05a2c;
        }
        .user-area .fa-bell {
            font-size: 1.3rem;
            color: #e09f3e;
            margin-right: 8px;
        }
        main {
            max-width: 1200px;
            margin: 32px auto 0 auto;
            background: #fff6e6ee;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 32px 24px;
            min-height: 70vh;
        }
        footer {
            text-align: center;
            padding: 18px 0;
            color: #a05a2c;
            background: #fff6e6ee;
            font-size: 1rem;
            margin-top: 32px;
        }
        @media (max-width: 900px) {
            .sidebar { width: 60px; }
            .sidebar .brand, .sidebar nav.menu a span { display: none; }
            .sidebar nav.menu a { justify-content: center; padding: 10px 0; }
            .main-wrapper { margin-left: 60px; }
        }
    </style>
</head>
<body>

<!-- Fragmento principal del layout -->
<div th:fragment="layout(content)">
    <aside class="sidebar">
        <div class="brand">
            <img th:src="@{/images/489776759_1445572563416672_585177025224455684_n.jpg}"
                 src="/images/489776759_1445572563416672_585177025224455684_n.jpg" alt="Logo" class="logo"/>
            Licorería
        </div>
        <nav class="menu">
            <a th:href="@{/}" href="/" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/'} ? 'active'">
                <i class="fa-solid fa-house"></i><span>Inicio</span></a>
            <a th:href="@{/productos/listar}" href="/productos/listar" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('productos')} ? 'active'">
                <i class="fa-solid fa-box"></i><span>Productos</span></a>
            <a th:href="@{/ventas/listar}" href="/ventas/listar" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('ventas')} ? 'active'">
                <i class="fa-solid fa-cash-register"></i><span>Ventas</span></a>
            <a th:href="@{/clientes/listar}" href="/clientes/listar" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('clientes')} ? 'active'">
                <i class="fa-solid fa-users"></i><span>Clientes</span></a>
            <a th:href="@{/proveedores/listar}" href="/proveedores/listar" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('proveedores')} ? 'active'">
                <i class="fa-solid fa-truck"></i><span>Proveedores</span></a>
            <a th:href="@{/reportes/listar}" href="/reportes/listar" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('reportes')} ? 'active'">
                <i class="fa-solid fa-chart-line"></i><span>Reportes</span></a>
            <a th:href="@{/carritos/listar}" href="/carritos/listar" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('carritos')} ? 'active'">
                <i class="fa-solid fa-cart-shopping"></i><span>Carrito</span></a>
        </nav>
    </aside>
    <div class="main-wrapper">
        <header>
            <div class="header-inner">
                <div></div>
                <div class="user-area">
                    <i class="fa-regular fa-bell" title="Notificaciones"></i>
                    <span class="username" th:text="${#authentication?.name ?: 'Usuario'}">Usuario</span>
                    <i class="fa-solid fa-user-circle"></i>
                    <a th:href="@{/logout}" href="/logout" title="Cerrar sesión" style="color:#e09f3e; margin-left:10px;"><i class="fa-solid fa-right-from-bracket"></i></a>
                </div>
            </div>
        </header>
        <main class="main-content">
            <!-- Aquí se insertará el contenido de cada vista -->
            <div th:replace="${content}"></div>
        </main>
        <footer>
            &copy; 2025 Licorería Don Polo. Todos los derechos reservados.
        </footer>
    </div>
</div>

</body>
</html>
