<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Carrito - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <header>
        <div class="brand">
            <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            Licorería DonPolo
        </div>
        <nav class="menu">
            <a th:href="@{/productos/listar}">Productos</a>
            <a th:href="@{/ventas/listar}">Ventas</a>
            <a th:href="@{/clientes/listar}">Clientes</a>
            <a th:href="@{/proveedores/listar}">Proveedores</a>
            <a th:href="@{/ventas/carrito}">Carritos</a>
            <a th:href="@{/reportes/listar}">Reportes</a>
            <a th:href="@{/home}">Inicio</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="card">
            <h2>Registrar Nuevo Carrito</h2>
            <form th:action="@{/carritos/guardar}" th:object="${carrito}" method="post">
                <div class="form-row">
                    <label for="usuario">Usuario:</label>
                    <select id="usuario" th:field="*{usuario}" required>
                        <option th:each="usuario : ${usuarios}" th:value="${usuario.idUsuario}" th:text="${usuario.nombre}"></option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="fechaCreacion">Fecha de Creación:</label>
                    <input type="date" id="fechaCreacion" th:field="*{fechaCreacion}" required />
                </div>
                <div class="form-row">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" th:field="*{estado}" required />
                </div>
                <div style="margin-top:18px;display:flex;gap:12px;">
                    <button type="submit" class="primary">Guardar</button>
                    <a th:href="@{/carritos/listar}" class="secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
