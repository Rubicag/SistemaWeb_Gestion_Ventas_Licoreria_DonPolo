<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto del Carrito - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <header>
        <div class="brand">
            <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            Licorería DonPolo
        </div>
        <nav class="menu">
            <a th:href="@{/productos/listar}">Productos</a>
            <a th:href="@{/ventas/listar}">Ventas</a>
            <a th:href="@{/clientes/listar}">Clientes</a>
            <a th:href="@{/proveedores/listar}">Proveedores</a>
            <a th:href="@{/ventas/carrito}">Carritos</a>
            <a th:href="@{/reportes/listar}">Reportes</a>
            <a th:href="@{/home}">Inicio</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="card">
            <h2>Editar Producto del Carrito</h2>
            <form th:action="@{/carritos/detalle/actualizar}" th:object="${detalleCarrito}" method="post">
                <input type="hidden" th:field="*{idDetalleCarrito}" />
                <input type="hidden" th:field="*{carrito}" />
                <div class="form-row">
                    <label for="producto">Producto:</label>
                    <select id="producto" th:field="*{producto}" required>
                        <option th:each="producto : ${productos}" th:value="${producto.idProducto}" th:text="${producto.nombre}"></option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" th:field="*{cantidad}" min="1" required />
                </div>
                <div style="margin-top:18px;display:flex;gap:12px;">
                    <button type="submit" class="primary">Actualizar</button>
                    <a th:href="@{'/carritos/detalle/' + ${detalleCarrito.carrito.idCarrito}}" class="secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
