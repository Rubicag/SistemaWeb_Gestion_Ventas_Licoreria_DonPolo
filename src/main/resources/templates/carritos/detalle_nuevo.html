<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"  th:replace="~{layout :: layout(content=~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto al Carrito - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/carritos.css}" href="/css/carritos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.09);
            margin: 120px auto 40px;
            padding: 28px;
            max-width: 480px;
        }
        h2 {
            color: #a05a2c;
            text-align: center;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .form-row {
            margin-bottom: 18px;
        }
        label {
            font-weight: 600;
            color: #a05a2c;
            display: block;
            margin-bottom: 6px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e09f3e99;
            font-size: 1rem;
            background: #fff;
        }
        .actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .primary {
            background: #e09f3e;
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .primary:hover {
            background: #a05a2c;
        }
        .secondary {
            background: #fff6e6ee;
            color: #a05a2c;
            border: 1px solid #e09f3e99;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .secondary:hover {
            background: #e09f3e;
            color: #fff;
        }
        .error {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<section>
    <div class="container">
        <div class="card">
            <h2><i class="fa-solid fa-cart-plus"></i> Agregar Producto al Carrito</h2>
            <form th:action="@{/carritos/detalle/guardar}" th:object="${detalleCarrito}" method="post">
                <!-- Identificador del carrito -->
                <input type="hidden" th:field="*{carrito}" />

                <!-- Producto -->
                <div class="form-row">
                    <label for="producto">Producto:</label>
                    <select id="producto" th:field="*{producto}" required>
                        <option value="" disabled selected>Seleccione un producto</option>
                        <option th:each="producto : ${productos}"
                                th:value="${producto.idProducto}"
                                th:text="${producto.nombre}">
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('producto')}" class="error" th:errors="*{producto}"></div>
                </div>

                <!-- Cantidad -->
                <div class="form-row">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" th:field="*{cantidad}" min="1" required />
                    <div th:if="${#fields.hasErrors('cantidad')}" class="error" th:errors="*{cantidad}"></div>
                </div>

                <!-- Botones -->
                <div class="actions">
                    <button type="submit" class="primary"><i class="fa-solid fa-plus"></i> Agregar</button>
                    <a th:href="@{'/carritos/detalle/' + ${detalleCarrito.carrito != null ? detalleCarrito.carrito.idCarrito : 0}}" 
                       class="secondary"><i class="fa-solid fa-xmark"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
