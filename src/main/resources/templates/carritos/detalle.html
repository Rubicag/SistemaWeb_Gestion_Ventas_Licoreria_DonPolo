<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Carrito - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
</head>
<body>
    <header>
        <div class="brand">
            <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            Licorería DonPolo
        </div>
        <nav class="menu">
            <a th:href="@{/productos/listar}">Productos</a>
            <a th:href="@{/ventas/listar}">Ventas</a>
            <a th:href="@{/clientes/listar}">Clientes</a>
            <a th:href="@{/proveedores/listar}">Proveedores</a>
            <a th:href="@{/ventas/carrito}">Carritos</a>
            <a th:href="@{/reportes/listar}">Reportes</a>
            <a th:href="@{/home}">Inicio</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="card">
            <h2>Detalle de Carrito</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${carrito.detalles}">
                            <td th:text="${detalle.producto.nombre}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="${detalle.producto.precio}"></td>
                            <td th:text="${detalle.subtotal}"></td>
                            <td>
                                <a th:href="@{'/carritos/detalle/editar/' + ${detalle.idDetalleCarrito}}" class="small-link">Editar</a>
                                <a th:href="@{'/carritos/detalle/eliminar/' + ${detalle.idDetalleCarrito}}" class="small-link" style="color:#d32f2f;margin-left:8px;" onclick="return confirm('¿Está seguro de eliminar este producto del carrito?');">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top:1.5rem;display:flex;gap:18px;">
                <a th:href="@{/carritos/listar}" class="primary">Volver a Carritos</a>
                <a th:href="@{'/carritos/detalle/nuevo/' + ${carrito.idCarrito}}" class="secondary">Agregar Producto</a>
            </div>
        </div>
    </main>
</body>
</html>
