<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle Carrito - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/carritos.css}" href="/css/carritos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .card{ background:#fff; border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,0.09); margin:120px auto 40px; padding:28px; max-width:900px; }
        h2{ color:#a05a2c; text-align:center; }
        .table-responsive{ overflow-x:auto; margin-bottom:1.5rem; }
        table{ width:100%; border-collapse:collapse }
        th,td{ padding:12px 8px; text-align:left }
        thead tr{ background:#fff6e6ee; color:#a05a2c }
        tbody tr:nth-child(even){ background:#f9f6f2 }
        .icon-btn{ background:none; border:none; cursor:pointer; color:#e09f3e; font-size:1.1rem; margin:0 4px; }
        .icon-btn:hover{ color:#a05a2c; }
        .primary{ background:#e09f3e; color:#fff; padding:10px 18px; border-radius:6px; border:none; font-weight:600; cursor:pointer; transition:background 0.2s; text-decoration:none; }
        .primary:hover{ background:#a05a2c; }
        .secondary{ background:#fff6e6ee; color:#a05a2c; border:1px solid #e09f3e99; border-radius:6px; padding:10px 18px; font-weight:600; cursor:pointer; text-decoration:none; transition:background 0.2s; }
        .secondary:hover{ background:#e09f3e; color:#fff; }
        .actions-bar{ margin-top:1.5rem; display:flex; gap:18px; justify-content:center; }
    </style>
</head>
<body>
    <section>
        <div class="container">
            <div class="card">
                <h2><i class="fa-solid fa-cart-shopping"></i> Detalle de Carrito</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-tag"></i> Producto</th>
                                <th><i class="fa-solid fa-cubes"></i> Cantidad</th>
                                <th><i class="fa-solid fa-dollar-sign"></i> Precio Unitario</th>
                                <th><i class="fa-solid fa-money-bill-wave"></i> Subtotal</th>
                                <th><i class="fa-solid fa-gear"></i> Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="detalle : ${carrito.detalles}">
                                <td th:text="${detalle.producto.nombre}"></td>
                                <td th:text="${detalle.cantidad}"></td>
                                <td th:text="${detalle.producto.precio}"></td>
                                <td th:text="${detalle.subtotal}"></td>
                                <td>
                                    <a th:href="@{'/carritos/detalle/editar/' + ${detalle.idDetalleCarrito}}" class="icon-btn" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <a th:href="@{'/carritos/detalle/eliminar/' + ${detalle.idDetalleCarrito}}" class="icon-btn" style="color:#d32f2f;" title="Eliminar" onclick="return confirm('¿Está seguro de eliminar este producto del carrito?');"><i class="fa-solid fa-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="actions-bar">
                    <a th:href="@{/carritos/listar}" class="primary"><i class="fa-solid fa-arrow-left"></i> Volver a Carritos</a>
                    <a th:href="@{'/carritos/detalle/nuevo/' + ${carrito.idCarrito}}" class="secondary"><i class="fa-solid fa-plus"></i> Agregar Producto</a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
