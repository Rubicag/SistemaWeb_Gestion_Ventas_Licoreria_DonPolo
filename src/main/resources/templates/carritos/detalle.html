<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalle Carrito - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            body { background: #f8f6f2; }
            .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.09); padding: 2.5rem; }
            .card-hero h2 { color: #a05a2c; display: flex; align-items: center; gap: 10px; }
            .info-label { font-weight: 600; color: #a05a2c; min-width: 120px; }
            .info-value { color: #333; }
            .btn-primary-custom { background: #a05a2c; border-color: #a05a2c; }
            .btn-primary-custom:hover { background: #e09f3e; border-color: #e09f3e; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="card card-hero mx-auto" style="max-width:700px;">
        <div class="card-body">
            <h2 class="mb-4"><i class="fa-solid fa-eye me-2"></i> Detalle del Carrito</h2>
            <div class="row mb-3">
                <div class="col-sm-4 info-label">ID Carrito:</div>
                <div class="col-sm-8 info-value" th:text="${carrito.idCarrito}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-4 info-label">Usuario:</div>
                <div class="col-sm-8 info-value">
                    <span th:text="${carrito.usuario.nombre}"></span>
                    <span class="text-muted" th:text="' (' + ${carrito.usuario.correo} + ')'" style="font-size:0.95em;"></span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-4 info-label">Fecha de Creación:</div>
                <div class="col-sm-8 info-value" th:text="${#dates.format(carrito.fechaCreacion, 'yyyy-MM-dd HH:mm')}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-4 info-label">Estado:</div>
                <div class="col-sm-8 info-value" th:text="${carrito.estado}"></div>
            </div>
            <a th:href="@{/carritos}" class="btn btn-primary btn-primary-custom mt-3"><i class="fa-solid fa-arrow-left me-2"></i> Volver al Listado</a>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
