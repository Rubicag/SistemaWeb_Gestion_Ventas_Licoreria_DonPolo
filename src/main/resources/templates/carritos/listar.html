<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carritos - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/carritos.css}" href="/css/carritos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .container{ max-width:1100px; margin:0 auto; padding:0 32px }
        .card{ background:#fff; border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,0.09); margin:120px auto 40px; padding:28px }
        h2{ color:#a05a2c; display:flex; align-items:center; gap:10px; }
        .primary{ background:#e09f3e; color:#fff; padding:8px 14px; border-radius:6px; text-decoration:none; font-weight:600; transition:background 0.2s; display:inline-block; margin-top:8px; }
        .primary:hover{ background:#a05a2c; }
        .table-responsive{ overflow-x:auto; margin-top:12px; }
        table{ width:100%; border-collapse:collapse }
        th,td{ padding:12px 8px; text-align:left }
        thead tr{ background:#fff6e6ee; color:#a05a2c }
        tbody tr:nth-child(even){ background:#f9f6f2 }
        .icon-btn{ background:none; border:none; cursor:pointer; color:#e09f3e; font-size:1.1rem; margin:0 4px; }
        .icon-btn:hover{ color:#a05a2c; }
        @media (max-width:900px){ .card{ margin-top:100px } }
    </style>
</head>
<body>
<section>
    <div class="container">
        <div class="card">
            <h2><i class="fa-solid fa-cart-shopping"></i> Listado de Carritos</h2>
            <a th:href="@{/carritos/nuevo}" class="primary"><i class="fa-solid fa-plus"></i> Registrar Nuevo Carrito</a>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fa-solid fa-hashtag"></i> ID Carrito</th>
                            <th><i class="fa-solid fa-user"></i> Usuario</th>
                            <th><i class="fa-solid fa-calendar"></i> Fecha Creación</th>
                            <th><i class="fa-solid fa-toggle-on"></i> Estado</th>
                            <th><i class="fa-solid fa-gear"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="carrito : ${carritos}">
                            <td th:text="${carrito.idCarrito}"></td>
                            <td th:text="${carrito.usuario.nombre}"></td>
                            <td th:text="${#dates.format(carrito.fechaCreacion, 'dd/MM/yyyy')}"></td>
                            <td th:text="${carrito.estado}"></td>
                            <td>
                                <a th:href="@{'/carritos/detalle/' + ${carrito.idCarrito}}" class="icon-btn" title="Ver Detalle"><i class="fa-solid fa-eye"></i></a>
                                <a th:href="@{'/carritos/editar/' + ${carrito.idCarrito}}" class="icon-btn" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{'/carritos/eliminar/' + ${carrito.idCarrito}}" class="icon-btn" style="color:#d32f2f;" title="Eliminar" onclick="return confirm('¿Está seguro de eliminar este carrito?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
