<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carritos - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            body { background: #f8f6f2; }
            .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.09); padding: 2.5rem; }
            .card-hero h2 { color: #a05a2c; display: flex; align-items: center; gap: 10px; }
            .btn-primary-custom { background: #a05a2c; border-color: #a05a2c; }
            .btn-primary-custom:hover { background: #e09f3e; border-color: #e09f3e; }
            table.table thead th { background: #fff6e6ee; color: #a05a2c; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="card card-hero mx-auto" style="max-width:1100px;">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0"><i class="fa-solid fa-cart-shopping me-2"></i> Listado de Carritos</h2>
                <a th:href="@{/carritos/nuevo}" class="btn btn-primary btn-primary-custom"><i class="fa-solid fa-plus me-2"></i> Registrar Nuevo Carrito</a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col"><i class="fa-solid fa-hashtag"></i> ID Carrito</th>
                            <th scope="col"><i class="fa-solid fa-user"></i> Usuario</th>
                            <th scope="col"><i class="fa-solid fa-envelope"></i> Correo</th>
                            <th scope="col"><i class="fa-solid fa-calendar"></i> Fecha Creación</th>
                            <th scope="col"><i class="fa-solid fa-toggle-on"></i> Estado</th>
                            <th scope="col"><i class="fa-solid fa-gear"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="carrito : ${carritos}">
                            <td th:text="${carrito != null ? carrito.idCarrito : ''}"></td>
                            <td th:text="${carrito != null && carrito.usuario != null ? carrito.usuario.nombre : 'Sin usuario'}"></td>
                            <td th:text="${carrito != null && carrito.usuario != null ? carrito.usuario.correo : 'Sin correo'}"></td>
                            <td th:text="${carrito != null && carrito.fechaCreacion != null ? #dates.format(carrito.fechaCreacion, 'yyyy-MM-dd HH:mm') : 'Sin fecha'}"></td>
                            <td>
                                <span th:if="${carrito != null and carrito.estado != null}" th:text="${carrito.estado}" th:classappend="${carrito.estado} == 'Activo' ? 'badge bg-success' : 'badge bg-secondary'"></span>
                                <span th:if="${carrito == null or carrito.estado == null}">Sin estado</span>
                            </td>
                            <td>
                                <a th:if="${carrito != null}" th:href="@{'/carritos/detalle/' + ${carrito.idCarrito}}" class="btn btn-sm btn-outline-info me-1" title="Ver Detalle"><i class="fa-solid fa-eye"></i></a>
                                <a th:if="${carrito != null}" th:href="@{'/carritos/editar/' + ${carrito.idCarrito}}" class="btn btn-sm btn-outline-primary me-1" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:if="${carrito != null}" th:href="@{'/carritos/eliminar/' + ${carrito.idCarrito}}" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Está seguro de eliminar este carrito?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
