<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carritos - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
    <style>
        /* Header & common */
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(120deg,#f7c873 0%,#e09f3e 100%); margin:0; min-height:100vh; }
        .header{ width:100vw; background:#fff6e6ee; box-shadow:0 2px 12px rgba(0,0,0,0.07); position:fixed; top:0; left:0; z-index:100 }
        .header-inner{ max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:72px }
        .brand{ display:flex; align-items:center; font-size:2rem; color:#a05a2c }
        .logo{ height:48px; margin-right:12px; border-radius:50%; background:#fff }
        .menu{ display:flex; gap:18px }
        .menu a{ color:#a05a2c; text-decoration:none; padding:8px 12px; border-radius:6px }
        .menu a:hover{ background:#e09f3e; color:#fff }
        .container{ max-width:1100px; margin:0 auto; padding:0 32px }
        .card{ background:#fff; border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,0.09); margin:120px auto 40px; padding:28px }
        h2{ color:#a05a2c }
        .primary{ background:#e09f3e; color:#fff; padding:8px 14px; border-radius:6px; text-decoration:none }
        .table-responsive{ overflow-x:auto }
        table{ width:100%; border-collapse:collapse }
        th,td{ padding:12px 8px; text-align:left }
        thead tr{ background:#fff6e6ee; color:#a05a2c }
        tbody tr:nth-child(even){ background:#f9f6f2 }
        .small-link{ color:#e09f3e }
        @media (max-width:900px){ .card{ margin-top:100px } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="brand">
                <img src="/images/logo-donpolo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                Licorería DonPolo
            </div>
            <nav class="menu">
                <a th:href="@{/productos/listar}">Productos</a>
                <a th:href="@{/ventas/listar}">Ventas</a>
                <a th:href="@{/clientes/listar}">Clientes</a>
                <a th:href="@{/proveedores/listar}">Proveedores</a>
                <a th:href="@{/carritos/listar}">Carritos</a>
                <a th:href="@{/reportes/listar}">Reportes</a>
            </nav>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <h2>Listado de Carritos</h2>
            <a th:href="@{/carritos/nuevo}" class="primary">Registrar Nuevo Carrito</a>
            <div class="table-responsive" style="margin-top:12px;">
                <table>
                    <thead>
                        <tr>
                            <th>ID Carrito</th>
                            <th>Usuario</th>
                            <th>Fecha Creación</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="carrito : ${carritos}">
                            <td th:text="${carrito.idCarrito}"></td>
                            <td th:text="${carrito.usuario.nombre}"></td>
                            <td th:text="${carrito.fechaCreacion}"></td>
                            <td th:text="${carrito.estado}"></td>
                            <td>
                                <a th:href="@{'/carritos/editar/' + ${carrito.idCarrito}}" class="small-link">Editar</a>
                                <a th:href="@{'/carritos/eliminar/' + ${carrito.idCarrito}}" class="small-link" style="color:#d32f2f;margin-left:8px;" onclick="return confirm('¿Está seguro de eliminar este carrito?');">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
