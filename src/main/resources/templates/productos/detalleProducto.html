<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Detalle de Producto - Licorería Don Polo</title>
        <link rel="stylesheet" th:href="@{/css/productos.css}" href="/css/productos.css" />
    </head>

    <section>
        <div class="container">
            <div class="card">
                <h2>Detalle de Producto</h2>
                <p><strong>ID:</strong> <span th:text="${producto.idProducto}"></span></p>
                <p><strong>Nombre:</strong> <span th:text="${producto.nombre}"></span></p>
                <p><strong>Precio:</strong> S/. <span th:text="${producto.precio}"></span></p>
                <p><strong>Cantidad:</strong> <span th:text="${producto.cantidad}"></span></p>
                <a th:href="@{/productos/listar}" class="primary" style="margin-top:1rem;display:inline-block;">Volver a la lista</a>
            </div>
        </div>
    </section>
</html>
