<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
    <h1>Agregar Producto</h1>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <label>Nombre:<br>
            <input type="text" th:field="*{nombre}" required placeholder="Nombre del producto" />
        </label><br><br>
        <label>Descripción:<br>
            <textarea th:field="*{descripcion}" required placeholder="Descripción del producto"></textarea>
        </label><br><br>
        <label>Precio:<br>
            <input type="number" step="0.01" th:field="*{precio}" required placeholder="Precio" />
        </label><br><br>
        <label>Stock:<br>
            <input type="number" min="0" th:field="*{stock}" required placeholder="Cantidad en stock" />
        </label><br><br>
        <label>Categoría:<br>
            <input type="text" th:field="*{categoria}" required placeholder="Categoría" />
        </label><br><br>
        <button type="submit">Guardar</button>
    </form>
    <div th:if="${error}">
        <p th:text="${error}" style="color:red;"></p>
    </div>
    <div th:if="${success}">
        <p th:text="${success}" style="color:green;"></p>
    </div>
    <div style="margin-top:1em;">
        <a th:href="@{'/productos/listar'}">Volver a la lista de productos</a>
    </div>
</body>
</html>
