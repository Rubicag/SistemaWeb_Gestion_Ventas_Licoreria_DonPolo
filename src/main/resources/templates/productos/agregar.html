<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Agregar Producto - Licorería Don Polo</title>
        <link rel="stylesheet" th:href="@{/css/productos.css}" href="/css/productos.css" />
    </head>

    <section>
        <div class="container">
            <div class="card">
                <h2>Agregar Producto</h2>
                <form th:action="@{/productos/agregar}" th:object="${producto}" method="post">
                    <div class="form-row">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" th:field="*{nombre}" required />
                        <div th:if="${#fields.hasErrors('nombre')}" class="error" style="color:#d32f2f;font-size:0.95em;">
                            * <span th:errors="*{nombre}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="precio">Precio:</label>
                        <input type="number" id="precio" th:field="*{precio}" step="0.01" required />
                        <div th:if="${#fields.hasErrors('precio')}" class="error" style="color:#d32f2f;font-size:0.95em;">
                            * <span th:errors="*{precio}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" th:field="*{cantidad}" required />
                        <div th:if="${#fields.hasErrors('cantidad')}" class="error" style="color:#d32f2f;font-size:0.95em;">
                            * <span th:errors="*{cantidad}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="categoriaId">Categoría:</label>
                        <select id="categoriaId" name="categoriaId" required>
                            <option value="" disabled selected>Selecciona una categoría</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.idCategoria}"
                                    th:text="${cat.nombre}"></option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="proveedorId">Proveedor:</label>
                        <select id="proveedorId" name="proveedorId" required>
                            <option value="" disabled selected>Selecciona un proveedor</option>
                            <option th:each="prov : ${proveedores}"
                                    th:value="${prov.idProveedor}"
                                    th:text="${prov.nombre}"></option>
                        </select>
                    </div>
                    <div style="margin-top:18px;display:flex;gap:12px;">
                        <button type="submit" class="primary">Guardar</button>
                        <a th:href="@{/productos/listar}" class="secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</html>
