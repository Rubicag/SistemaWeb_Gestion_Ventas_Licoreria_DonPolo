<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
    <h1>Productos Disponibles</h1>
    <div th:if="${productos == null or #lists.isEmpty(productos)}">
        <p>No hay productos disponibles.</p>
    </div>
    <div th:if="${productos != null and !#lists.isEmpty(productos)}">
        <table border="1">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.descripcion}"></td>
                    <td th:text="${producto.precio}"></td>
                    <td th:text="${producto.stock}"></td>
                    <td>
                        <form th:action="@{'/carrito/agregar/' + ${producto.id}}" method="get" style="display:inline;">
                            <input type="number" name="cantidad" value="1" min="1" th:attr="max=${producto.stock}" style="width:50px;" />
                            <button type="submit" th:disabled="${producto.stock == 0}">Agregar al carrito</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div style="margin-top:1em;">
        <a th:href="@{'/carrito/ver'}">Ver carrito</a>
    </div>
</body>
</html>
