<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Productos - Licorería Don Polo</title>
        <link rel="stylesheet" th:href="@{/css/productos.css}" href="/css/productos.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            .productos-hero {
                background: #fff6e6ee;
                border-radius: 18px;
                box-shadow: 0 6px 32px rgba(160,90,44,0.10);
                max-width: 900px;
                margin: 60px auto 0 auto;
                padding: 44px 32px 32px 32px;
                position: relative;
            }
            .productos-hero h2 {
                color: #a05a2c;
                font-size: 2rem;
                margin-bottom: 18px;
                font-weight: 700;
                text-align: center;
            }
            .productos-hero .add-btn {
                display: inline-block;
                background: #a05a2c;
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 10px 22px;
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 18px;
                text-decoration: none;
                transition: background 0.2s;
            }
            .productos-hero .add-btn:hover {
                background: #e09f3e;
                color: #fff;
            }
            .productos-hero .table-responsive {
                overflow-x: auto;
            }
            .productos-hero table {
                width: 100%;
                border-collapse: collapse;
                background: #fff;
                border-radius: 10px;
                overflow: hidden;
                margin-top: 10px;
            }
            .productos-hero th, .productos-hero td {
                padding: 12px 10px;
                text-align: center;
            }
            .productos-hero th {
                background: #e09f3e;
                color: #fff;
                font-weight: 600;
                font-size: 1.05rem;
            }
            .productos-hero tr:nth-child(even) {
                background: #fff6e6;
            }
            .productos-hero tr:hover {
                background: #ffe0b2;
            }
            .productos-hero .acciones a {
                margin: 0 6px;
                font-size: 1.1rem;
                text-decoration: none;
                color: #a05a2c;
                transition: color 0.2s;
            }
            .productos-hero .acciones a:hover {
                color: #d32f2f;
            }
            .productos-hero .acciones .icon-edit {
                color: #1976d2;
            }
            .productos-hero .acciones .icon-delete {
                color: #d32f2f;
            }
        </style>
    </head>

    <!-- 🔹 Contenido principal -->
    <section>
        <div class="productos-hero">
            <h2><i class="fa-solid fa-box"></i> Gestión de Productos</h2>
            <a th:href="@{/productos/nuevo}" class="add-btn"><i class="fa-solid fa-plus"></i> Agregar Producto</a>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fa-solid fa-hashtag"></i> ID</th>
                            <th><i class="fa-solid fa-tag"></i> Nombre</th>
                            <th><i class="fa-solid fa-dollar-sign"></i> Precio</th>
                            <th><i class="fa-solid fa-cubes"></i> Cantidad</th>
                            <th><i class="fa-solid fa-gear"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.idProducto}"></td>
                            <td th:text="${producto.nombre}"></td>
                            <td th:text="${producto.precio}"></td>
                            <td th:text="${producto.cantidad}"></td>
                            <td class="acciones">
                                <a th:href="@{'/productos/editar/' + ${producto.idProducto}}" title="Editar" class="icon-edit"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{'/productos/eliminar/' + ${producto.idProducto}}" title="Eliminar" class="icon-delete" onclick="return confirm('¿Deseas eliminar este producto?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="5" style="color:#a05a2c;font-weight:500;">No hay productos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</html>
