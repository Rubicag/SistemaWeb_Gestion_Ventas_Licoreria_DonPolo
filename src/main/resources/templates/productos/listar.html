<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Productos - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            body { background: #f8f6f2; }
            .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 6px 32px rgba(160,90,44,0.10); padding: 2.5rem; }
            .card-hero h2 { color:#a05a2c; font-weight:700; }
            .btn-primary-custom { background:#a05a2c; border-color:#a05a2c; }
            .btn-primary-custom:hover { background:#e09f3e; border-color:#e09f3e; }
            table.table thead th { background:#e09f3e; color:#fff; }
            tr.table-row:nth-child(even) { background:#fff6e6; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="card card-hero mx-auto" style="max-width:1100px;">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0"><i class="fa-solid fa-box me-2"></i> Gestión de Productos</h2>
                <a th:href="@{/productos/nuevo}" class="btn btn-primary btn-primary-custom"><i class="fa-solid fa-plus me-2"></i> Agregar Producto</a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col"><i class="fa-solid fa-hashtag"></i> ID</th>
                            <th scope="col"><i class="fa-solid fa-tag"></i> Nombre</th>
                            <th scope="col"><i class="fa-solid fa-dollar-sign"></i> Precio</th>
                            <th scope="col"><i class="fa-solid fa-cubes"></i> Cantidad</th>
                            <th scope="col"><i class="fa-solid fa-gear"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}" class="table-row">
                            <td th:text="${producto.idProducto}"></td>
                            <td th:text="${producto.nombre}"></td>
                            <td th:text="${producto.precio}"></td>
                            <td th:text="${producto.cantidad}"></td>
                            <td>
                                <a th:href="@{'/productos/editar/' + ${producto.idProducto}}" class="btn btn-sm btn-outline-primary me-1" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{'/productos/eliminar/' + ${producto.idProducto}}" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Deseas eliminar este producto?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="5" class="text-center text-muted">No hay productos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
