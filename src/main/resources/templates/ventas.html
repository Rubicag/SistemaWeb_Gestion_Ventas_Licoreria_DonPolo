<div th:replace="~{fragments/layout :: base(title='Ventas', active='ventas')}">
    <div th:fragment="head">
        <link rel="stylesheet" th:href="@{/css/ventas.css}" />
    </div>
    <div th:fragment="content">
            <div class="container-main">
        <!-- Alertas Modernas -->
        <div th:if="${mensaje}" class="alert alert-modern alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-modern alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Card Principal Moderna -->
            <div class="modern-card">
            <div class="modern-card-header">
                <h3><i class="fas fa-cash-register me-2"></i>Gestión de Ventas</h3>
                <button onclick="nuevaVenta()" class="btn btn-modern-primary">
                    <i class="fas fa-plus-circle me-2"></i>Nueva Venta
                </button>
            </div>

            <div class="modern-card-body">
                <!-- Búsqueda Moderna -->
                <div class="search-box-modern mb-4">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscarVenta" class="form-control" 
                           placeholder="Buscar por cliente, comprobante..." onkeyup="filtrarTabla()">
                </div>

                <!-- Tabla Moderna -->
                <div class="table-responsive">
                    <table class="table table-modern" id="tablaVentas">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Comprobante</th>
                        <th>Método Pago</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td><span class="badge badge-modern-secondary" th:text="${venta.idVenta}">1</span></td>
                        <td th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">01/11/2025</td>
                        <td><i class="fas fa-user-circle me-2 icon-secondary"></i><span th:text="${venta.nombreCliente != null ? venta.nombreCliente : 'Cliente General'}">Juan Pérez</span></td>
                        <td th:text="${venta.comprobante != null ? venta.comprobante : '-'}">B001-00123</td>
                        <td>
                            <span class="badge badge-modern-info" th:text="${venta.metodoPago}">EFECTIVO</span>
                        </td>
                        <td>
                            <strong class="precio-venta">S/ <span th:text="${#numbers.formatDecimal(venta.total, 1, 2)}">150.00</span></strong>
                        </td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${venta.estado == 'COMPLETADA'} ? 'badge-modern-success' : 'badge-modern-danger'"
                                  th:text="${venta.estado}">COMPLETADA</span>
                        </td>
                        <td>
                            <div class="btn-group" role="group">
                                <button class="btn btn-modern-info btn-sm btn-ver-detalle" 
                                        th:data-venta-id="${venta.idVenta}"
                                        title="Ver Detalle">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button th:if="${venta.estado == 'COMPLETADA'}" 
                                        class="btn btn-modern-danger btn-sm btn-anular-venta"
                                        th:data-venta-id="${venta.idVenta}" 
                                        title="Anular">
                                    <i class="fas fa-ban"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="fas fa-cash-register fa-3x mb-3 opacity-25"></i><br>
                            <span class="text-large">No hay ventas registradas</span><br>
                            <small class="text-muted">Crea tu primera venta para comenzar</small>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div id="ventasPagination" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Venta -->
    <div class="modal fade" id="modalVenta" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content modal-modern">
                <div class="modal-header modal-header-modern">
                    <h5 class="modal-title"><i class="fas fa-cart-plus"></i> <span id="modalTitulo">Nueva Venta</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formVenta" method="post" th:action="@{/ventas/guardar}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" id="idVenta" name="idVenta">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="idCliente" class="form-label">
                                    <i class="fas fa-user"></i> Cliente (Opcional)
                                </label>
                                <select class="form-select" id="idCliente" name="idCliente">
                                    <option value="">-- Cliente --</option>
                                    <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nombre + ' ' + c.apellido}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="fas fa-box"></i> Producto</label>
                                <div class="input-group">
                                    <select class="form-select" id="productoSeleccionado">
                                        <option value="">Seleccione producto</option>
                                        <option th:each="p : ${productos}"
                                                th:value="${p.idProducto}"
                                                th:text="${p.nombre + ' - S/ ' + #numbers.formatDecimal(p.precio,1,2)}"
                                                th:attr="data-precio=${p.precio}, data-stock=${p.stock}">
                                        </option>
                                    </select>
                                    <input type="number" id="cantidadProducto" class="form-control input-narrow" value="1" min="1" />
                                    <button type="button" class="btn btn-modern-primary" onclick="agregarAlCarrito()">Agregar</button>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-8">
                                <div id="carritoItems" class="mb-3"> <!-- llenado por JS --> </div>
                                <div id="detallesHidden"> <!-- hidden inputs creados por JS --> </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-money-bill-wave"></i> Método de Pago</label>
                                    <select id="metodoPago" name="metodoPago" class="form-select">
                                        <option value="">Seleccione...</option>
                                        <option value="EFECTIVO">EFECTIVO</option>
                                        <option value="TARJETA">TARJETA</option>
                                    </select>
                                </div>
                                <div class="mb-3 text-end">
                                    <div id="totalVenta" class="total-venta">Total: S/ 0.00</div>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-modern-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formVenta" class="btn btn-modern-primary" onclick="return validarVenta();">Guardar Venta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle Venta (reutilizable) -->
    <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-receipt"></i> Detalle de Venta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="detalleVentaBody"><!-- contenido inyectado por ventas.js --> </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">/*<![CDATA[*/
            window.VENTAS_DATA = /*[[${ventas}]]*/ [];
            window.PRODUCTOS_DATA = /*[[${productos}]]*/ [];
            window.CLIENTES_DATA = /*[[${clientes}]]*/ [];
        /*]]>*/</script>
        <script th:src="@{/js/ventas.js}"></script>
    </div>

    </div>
</div>
