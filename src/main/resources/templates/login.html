<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar Sesión - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { background:#f8f6f2; }
            .auth-card { background:#fff6e6ee; border-radius:1rem; box-shadow:0 6px 32px rgba(160,90,44,0.10); padding:2.5rem; max-width:480px; }
            .auth-card h2 { color:#a05a2c; font-weight:700; }
            .btn-primary-custom { background:#a05a2c; border-color:#a05a2c; }
            .btn-primary-custom:hover { background:#e09f3e; border-color:#e09f3e; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="auth-card mx-auto text-center">
        <div class="mb-3">
            <img th:src="@{/images/489776759_1445572563416672_585177025224455684_n.jpg}"
                     src="/images/489776759_1445572563416672_585177025224455684_n.jpg"
                     alt="Logo"
                     class="rounded-circle"
                     style="height:70px;width:70px;box-shadow:0 2px 8px rgba(0,0,0,0.08);background:#fff;"/>
        </div>
        <h2>Iniciar Sesión</h2>
        <form th:action="@{/login}" method="post" class="mt-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3 text-start">
                <label for="username" class="form-label text-muted">Correo electrónico</label>
                <input type="email" id="username" name="username" placeholder="usuario@correo.com" required class="form-control" />
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label text-muted">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required class="form-control" />
            </div>
            <div class="d-grid mb-2">
                <button type="submit" class="btn btn-primary btn-primary-custom">Iniciar sesión</button>
            </div>
            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">Usuario o contraseña incorrectos</div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">Sesión cerrada correctamente</div>
        </form>
        <div class="help mt-3">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
