<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
<section>
    <style>
        .login-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 420px;
            margin: 60px auto 0 auto;
            padding: 44px 32px 32px 32px;
            text-align: center;
            position: relative;
        }
        .login-hero .logo {
            margin-bottom: 18px;
        }
        .login-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .login-hero form {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-hero label {
            font-weight: 500;
            color: #a05a2c;
            margin-bottom: 4px;
            text-align: left;
        }
        .login-hero input[type="email"],
        .login-hero input[type="password"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e09f3e;
            font-size: 1rem;
            background: #fff;
            margin-bottom: 8px;
        }
        .login-hero button.primary {
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-hero button.primary:hover {
            background: #e09f3e;
        }
        .login-hero .error {
            color: #d32f2f;
            background: #fff0f0;
            border-radius: 4px;
            padding: 8px 0;
            margin-top: 8px;
            font-size: 0.98rem;
        }
        .login-hero .success {
            color: #388e3c;
            background: #e8f5e9;
            border-radius: 4px;
            padding: 8px 0;
            margin-top: 8px;
            font-size: 0.98rem;
        }
        .login-hero .help {
            margin-top: 18px;
            font-size: 1rem;
        }
        .login-hero .help a {
            color: #e09f3e;
            text-decoration: underline;
            font-weight: 500;
        }
        .login-hero .icon {
            font-size: 2.2rem;
            color: #e09f3e;
            margin-bottom: 8px;
            display: block;
        }
    </style>

    <div class="login-hero">
        <span class="icon">🔐</span>
        <div class="logo">
            <img th:src="@{/images/489776759_1445572563416672_585177025224455684_n.jpg}"
                 src="/images/489776759_1445572563416672_585177025224455684_n.jpg"
                 alt="Logo"
                 style="height:70px;width:70px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:10px;"/>
        </div>
        <h2>Iniciar Sesión</h2>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label for="username">Correo electrónico:</label>
            <input type="email" id="username" name="username" placeholder="usuario@correo.com" required />

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />

            <button type="submit" class="primary">Iniciar sesión</button>

            <div th:if="${param.error}" class="error">Usuario o contraseña incorrectos</div>
            <div th:if="${param.logout}" class="success">Sesión cerrada correctamente</div>
        </form>

        <div class="help">
            ¿No tienes cuenta? <a th:href="@{/registro}" class="small-link">Regístrate aquí</a>
        </div>
    </div>
</section>
</html>
