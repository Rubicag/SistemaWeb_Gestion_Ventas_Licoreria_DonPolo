<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuarios - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}" href="/css/usuarios.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<!-- ... -->
    <section>
        <div class="container">
            <div class="card">
                <h2><i class="fa-solid fa-user-plus" style="color:#e09f3e;"></i> Registrar Nuevo Usuario</h2>
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="form">
                    <div class="form-group">
                        <label for="nombre"><i class="fa-solid fa-user"></i> Nombre:</label>
                        <input type="text" id="nombre" th:field="*{nombre}" required />
                        <div th:if="${#fields.hasErrors('nombre')}" class="error" style="color:#d32f2f;font-size:0.95em;"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{nombre}"></span></div>
                    </div>
                    <div class="form-group">
                        <label for="apellido"><i class="fa-solid fa-user"></i> Apellido:</label>
                        <input type="text" id="apellido" th:field="*{apellido}" required />
                        <div th:if="${#fields.hasErrors('apellido')}" class="error" style="color:#d32f2f;font-size:0.95em;"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{apellido}"></span></div>
                    </div>
                    <div class="form-group">
                        <label for="correo"><i class="fa-solid fa-envelope"></i> Correo:</label>
                        <input type="email" id="correo" th:field="*{correo}" required />
                        <div th:if="${#fields.hasErrors('correo')}" class="error" style="color:#d32f2f;font-size:0.95em;"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{correo}"></span></div>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Contraseña:</label>
                        <input type="password" id="password" th:field="*{password}" required />
                        <div th:if="${#fields.hasErrors('password')}" class="error" style="color:#d32f2f;font-size:0.95em;"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{password}"></span></div>
                    </div>
                    <div class="form-group">
                        <label for="rol"><i class="fa-solid fa-user-shield"></i> Rol:</label>
                        <select id="rol" th:field="*{rol}" required>
                            <option value="" disabled>Seleccione un rol</option>
                            <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('rol')}" class="error" style="color:#d32f2f;font-size:0.95em;"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{rol}"></span></div>
                    </div>
                    <div class="form-group">
                        <label for="estado"><i class="fa-solid fa-toggle-on"></i> Estado:</label>
                        <select id="estado" th:field="*{estado}" required>
                            <option value="" disabled>Seleccione estado</option>
                            <option value="ACTIVO">Activo</option>
                            <option value="INACTIVO">Inactivo</option>
                        </select>
                        <div th:if="${#fields.hasErrors('estado')}" class="error" style="color:#d32f2f;font-size:0.95em;"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{estado}"></span></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        <a th:href="@{/usuarios/listar}" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</th:block>
</html>
