<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrar Usuario - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            body { background: #f8f6f2; }
            .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.09); padding: 2.5rem; max-width: 440px; margin: 60px auto; }
            .card-hero h2 { color: #a05a2c; display: flex; align-items: center; gap: 10px; justify-content: center; }
            .btn-primary-custom { background: #a05a2c; border-color: #a05a2c; }
            .btn-primary-custom:hover { background: #e09f3e; border-color: #e09f3e; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="card card-hero">
        <h2 class="mb-4"><i class="fa-solid fa-user-plus me-2"></i> Registrar Nuevo Usuario</h2>
        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required />
                <div th:if="${#fields.hasErrors('nombre')}" class="text-danger small"><span th:errors="*{nombre}"></span></div>
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required />
                <div th:if="${#fields.hasErrors('apellido')}" class="text-danger small"><span th:errors="*{apellido}"></span></div>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" id="correo" th:field="*{correo}" class="form-control" required />
                <div th:if="${#fields.hasErrors('correo')}" class="text-danger small"><span th:errors="*{correo}"></span></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" required />
                <div th:if="${#fields.hasErrors('password')}" class="text-danger small"><span th:errors="*{password}"></span></div>
            </div>
            <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <select id="rol" th:field="*{rol}" class="form-select" required>
                    <option value="" disabled>Seleccione un rol</option>
                    <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
                </select>
                <div th:if="${#fields.hasErrors('rol')}" class="text-danger small"><span th:errors="*{rol}"></span></div>
            </div>
            <div class="mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select id="estado" th:field="*{estado}" class="form-select" required>
                    <option value="" disabled>Seleccione estado</option>
                    <option value="ACTIVO">Activo</option>
                    <option value="INACTIVO">Inactivo</option>
                </select>
                <div th:if="${#fields.hasErrors('estado')}" class="text-danger small"><span th:errors="*{estado}"></span></div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-primary-custom"><i class="fa-solid fa-floppy-disk me-2"></i> Guardar</button>
                <a th:href="@{/usuarios/listar}" class="btn btn-secondary"><i class="fa-solid fa-xmark me-2"></i> Cancelar</a>
            </div>
        </form>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
