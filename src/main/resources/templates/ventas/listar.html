<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Listado de Ventas - Licorería Don Polo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <style>
            body { background: #f8f6f2; }
            .card-hero { background: #fff6e6ee; border-radius: 1rem; box-shadow: 0 6px 32px rgba(160,90,44,0.10); padding: 2.5rem; }
            .card-hero h2 { color:#a05a2c; font-weight:700; }
            .btn-primary-custom { background:#a05a2c; border-color:#a05a2c; }
            .btn-primary-custom:hover { background:#e09f3e; border-color:#e09f3e; }
            table.table thead th { background:#e09f3e; color:#fff; }
            .acciones a { margin-right:6px; }
        </style>
</head>
<body>
<section class="container py-5">
    <div class="card card-hero mx-auto" style="max-width:1100px;">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0"><i class="fa-solid fa-cash-register me-2"></i> Listado de Ventas</h2>
                <a th:href="@{/ventas/registro}" class="btn btn-primary btn-primary-custom"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Registrar Nueva Venta</a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col"><i class="fa-solid fa-hashtag"></i> ID Venta</th>
                            <th scope="col"><i class="fa-solid fa-calendar"></i> Fecha</th>
                            <th scope="col"><i class="fa-solid fa-dollar-sign"></i> Total</th>
                            <th scope="col"><i class="fa-solid fa-user"></i> Cliente</th>
                            <th scope="col"><i class="fa-solid fa-gear"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="venta : ${ventas}">
                            <td th:text="${venta.id}"></td>
                            <td th:text="${venta.fechaFormateada}"></td>
                            <td th:text="${venta.total}"></td>
                            <td th:text="${venta.cliente.nombre}"></td>
                            <td class="acciones">
                                <a th:href="@{'/ventas/editar/' + ${venta.id}}" title="Editar" class="btn btn-sm btn-outline-primary me-1"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{'/ventas/eliminar/' + ${venta.id}}" title="Eliminar" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Está seguro de eliminar esta venta?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="5" class="text-center text-muted">No hay ventas registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
