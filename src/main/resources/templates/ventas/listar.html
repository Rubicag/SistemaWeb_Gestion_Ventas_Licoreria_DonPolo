<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Listado de Ventas - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/ventas.css}" href="/css/ventas.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .ventas-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 1000px;
            margin: 60px auto 0 auto;
            padding: 44px 32px 32px 32px;
            position: relative;
        }
        .ventas-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
            text-align: center;
        }
        .ventas-hero .add-btn {
            display: inline-block;
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 22px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .ventas-hero .add-btn:hover {
            background: #e09f3e;
            color: #fff;
        }
        .ventas-hero .table-responsive {
            overflow-x: auto;
        }
        .ventas-hero table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .ventas-hero th, .ventas-hero td {
            padding: 12px 10px;
            text-align: center;
        }
        .ventas-hero th {
            background: #e09f3e;
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .ventas-hero tr:nth-child(even) {
            background: #fff6e6;
        }
        .ventas-hero tr:hover {
            background: #ffe0b2;
        }
        .ventas-hero .acciones a {
            margin: 0 6px;
            font-size: 1.1rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .ventas-hero .acciones .icon-edit {
            color: #1976d2;
        }
        .ventas-hero .acciones .icon-edit:hover {
            color: #0d47a1;
        }
        .ventas-hero .acciones .icon-delete {
            color: #d32f2f;
        }
        .ventas-hero .acciones .icon-delete:hover {
            color: #b71c1c;
        }
    </style>
</head>
<body>
<section>
    <div class="ventas-hero">
        <h2><i class="fa-solid fa-cash-register"></i> Listado de Ventas</h2>
        <a th:href="@{/ventas/registro}" class="add-btn"><i class="fa-solid fa-file-invoice-dollar"></i> Registrar Nueva Venta</a>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th><i class="fa-solid fa-hashtag"></i> ID Venta</th>
                        <th><i class="fa-solid fa-calendar"></i> Fecha</th>
                        <th><i class="fa-solid fa-dollar-sign"></i> Total</th>
                        <th><i class="fa-solid fa-user"></i> Cliente</th>
                        <th><i class="fa-solid fa-gear"></i> Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${venta.idVenta}"></td>
                        <td th:text="${#dates.format(venta.fechaVenta, 'dd/MM/yyyy')}"></td>
                        <td th:text="${venta.total}"></td>
                        <td th:text="${venta.cliente.nombre}"></td>
                        <td class="acciones">
                            <a th:href="@{'/ventas/editar/' + ${venta.idVenta}}" title="Editar" class="icon-edit"><i class="fa-solid fa-pen-to-square"></i></a>
                            <a th:href="@{'/ventas/eliminar/' + ${venta.idVenta}}" title="Eliminar" class="icon-delete" onclick="return confirm('¿Está seguro de eliminar esta venta?');"><i class="fa-solid fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="5" style="color:#a05a2c;font-weight:500;">
                            No hay ventas registradas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
