<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/ventas.css}" href="/css/ventas.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>
<section>
    <style>
        .carrito-container {
            max-width: 1000px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            padding: 32px;
        }
        h2 {
            color: #a05a2c;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #e0c3a0;
            padding: 12px;
            text-align: center;
            font-size: 1rem;
        }
        th {
            background-color: #f7c873;
            color: #5a3c1a;
        }
        td input[type="number"] {
            width: 60px;
            text-align: center;
            padding: 4px;
            border: 1px solid #e09f3e;
            border-radius: 4px;
        }
        .total {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            color: #a05a2c;
            margin-top: 10px;
        }
        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn-primary {
            background: #a05a2c;
            color: #fff;
        }
        .btn-primary:hover {
            background: #e09f3e;
        }
        .btn-danger {
            background: #d32f2f;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
        .empty {
            text-align: center;
            color: #555;
            font-size: 1.1rem;
            padding: 30px;
        }
    </style>

    <div class="carrito-container">
    <h2><i class="fa-solid fa-cart-shopping" style="color:#e09f3e;"></i> Carrito de Compras</h2>

        <div th:if="${#lists.isEmpty(carrito)}">
            <p class="empty"><i class="fa-solid fa-circle-info"></i> Tu carrito está vacío. <a th:href="@{/productos/listar}" style="color:#e09f3e;text-decoration:underline;"><i class="fa-solid fa-box"></i> Ver productos</a></p>
        </div>

        <div th:if="${!#lists.isEmpty(carrito)}">
            <table>
                <thead>
                    <tr>
                        <th><i class="fa-solid fa-box"></i> Producto</th>
                        <th><i class="fa-solid fa-money-bill-wave"></i> Precio Unitario</th>
                        <th><i class="fa-solid fa-sort-numeric-up"></i> Cantidad</th>
                        <th><i class="fa-solid fa-calculator"></i> Total</th>
                        <th><i class="fa-solid fa-gear"></i> Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${carrito}">
                        <td th:text="${item.producto.nombre}">Ron Cartavio</td>
                        <td th:text="${item.producto.precio}">40.00</td>
                        <td>
                            <input type="number" min="1" th:value="${item.cantidad}" />
                        </td>
                        <td th:text="${item.total}">80.00</td>
                        <td>
                            <form th:action="@{/carritos/eliminar}" method="post" style="display:inline;">
                                <input type="hidden" th:name="id" th:value="${item.id}" />
                                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="total">
                <i class="fa-solid fa-money-bill-wave"></i> Total general: S/ <span th:text="${totalGeneral}">160.00</span>
            </div>

            <div class="acciones">
                <form th:action="@{/carritos/vaciar}" method="post">
                    <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Vaciar Carrito</button>
                </form>
                <form th:action="@{/ventas/registrar}" method="post">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-credit-card"></i> Finalizar Compra</button>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
