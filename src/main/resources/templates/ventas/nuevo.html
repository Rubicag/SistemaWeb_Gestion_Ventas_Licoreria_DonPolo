<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nueva Venta - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/ventas.css}" href="/css/ventas.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .venta-form-hero {
            background: #fff6e6ee;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(160,90,44,0.10);
            max-width: 600px;
            margin: 60px auto 0 auto;
            padding: 44px 32px 32px 32px;
            position: relative;
            text-align: center;
        }
        .venta-form-hero h2 {
            color: #a05a2c;
            font-size: 2rem;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .venta-form-hero form {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .venta-form-hero label {
            font-weight: 500;
            color: #a05a2c;
            margin-bottom: 4px;
            text-align: left;
        }
        .venta-form-hero select,
        .venta-form-hero input[type="number"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e09f3e;
            font-size: 1rem;
            background: #fff;
            margin-bottom: 8px;
        }
        .venta-form-hero .productos-carrito {
            margin: 18px 0 10px 0;
        }
        .venta-form-hero table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .venta-form-hero th, .venta-form-hero td {
            padding: 10px 8px;
            text-align: center;
        }
        .venta-form-hero th {
            background: #e09f3e;
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .venta-form-hero tr:nth-child(even) {
            background: #fff6e6;
        }
        .venta-form-hero .form-actions {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
        }
        .venta-form-hero .btn {
            background: #a05a2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .venta-form-hero .btn:hover {
            background: #e09f3e;
        }
        .venta-form-hero .btn.btn-secondary {
            background: #e09f3e;
            color: #fff;
        }
        .venta-form-hero .btn.btn-secondary:hover {
            background: #a05a2c;
        }
    </style>
</head>

<body>
<section>
    <div class="venta-form-hero">
        <h2><i class="fa-solid fa-cart-plus" style="color:#e09f3e;"></i> Registrar Nueva Venta</h2>
        <form th:action="@{/ventas/registro}" th:object="${venta}" method="post">
            <label for="usuario"><i class="fa-solid fa-user"></i> Usuario:</label>
            <select id="usuario" th:field="*{usuario}" required>
                <option value="" disabled selected>Seleccione un usuario</option>
                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.idUsuario}"
                        th:text="${usuario.nombre}"></option>
            </select>

            <label for="metodoPago"><i class="fa-solid fa-credit-card"></i> Método de Pago:</label>
            <select id="metodoPago" name="metodoPago" required>
                <option value="" disabled selected>Seleccione un método</option>
                <option th:each="mp : ${metodosPago}"
                        th:value="${mp}" th:text="${mp}"></option>
            </select>

            <div class="productos-carrito">
                <label><i class="fa-solid fa-box"></i> Productos en carrito:</label>
                <table>
                    <thead>
                        <tr>
                            <th><i class="fa-solid fa-box"></i> Producto</th>
                            <th><i class="fa-solid fa-sort-numeric-up"></i> Cantidad</th>
                            <th><i class="fa-solid fa-money-bill-wave"></i> Precio Unitario</th>
                            <th><i class="fa-solid fa-calculator"></i> Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${carrito}">
                            <td th:text="${item.producto.nombre}"></td>
                            <td th:text="${item.cantidad}"></td>
                            <td th:text="${item.producto.precio}"></td>
                            <td th:text="${#numbers.formatDecimal(item.producto.precio * item.cantidad, 1, 'POINT', 2, 'NONE')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

         <label for="total"><i class="fa-solid fa-money-bill-wave"></i> Total:</label>
         <input type="number" id="total"
             th:value="${#numbers.formatDecimal(totalVenta, 1, 'POINT', 2, 'NONE')}"
             readonly />

            <div class="form-actions">
                <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                <a th:href="@{/ventas/listar}" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancelar</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
