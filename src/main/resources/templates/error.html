<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Licorería Don Polo</title>
    <style>
        .container-error {
            max-width: 600px;
            margin: 40px auto 0 auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.09);
            padding: 48px 32px 32px 32px;
            text-align: center;
        }
        .container-error h1 {
            color: #d32f2f;
            font-size: 2.2rem;
            margin-bottom: 18px;
        }
        .container-error p {
            color: #444;
            font-size: 1.1rem;
        }
        .container-error a {
            color: #e09f3e;
            text-decoration: underline;
            font-weight: 500;
        }
    </style>
</head>

<body th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="container-error">
            <h1>Ha ocurrido un error</h1>
            <p th:text="${message}">Lo sentimos, se ha producido un error inesperado.</p>
            <a th:href="@{/}" href="/">Volver al inicio</a>
        </div>
    </section>
</body>
</html>
