<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Licorería DonPolo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css" />
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff6e6ee; margin:0; }
        .container { max-width: 600px; margin: 120px auto 0 auto; background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.09); padding: 48px 32px 32px 32px; text-align: center; }
        h1 { color: #d32f2f; font-size: 2.2rem; margin-bottom: 18px; }
        p { color: #444; font-size: 1.1rem; }
        a { color: #e09f3e; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ha ocurrido un error</h1>
        <p th:text="${message}">Lo sentimos, se ha producido un error inesperado.</p>
        <a th:href="@{/}" href="/">Volver al inicio</a>
    </div>
</body>
</html>
