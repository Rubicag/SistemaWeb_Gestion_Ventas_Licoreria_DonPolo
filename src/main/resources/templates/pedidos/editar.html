<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
    <th:block th:fragment="head">
        <link rel="stylesheet" th:href="@{/css/pedidos.css}" href="/css/pedidos.css" />
    </th:block>

    <main class="main-content">
        <div class="card">
            <h2>Editar Pedido</h2>
            <form th:action="@{/pedidos/actualizar}" th:object="${pedido}" method="post">
                <!-- ID oculto -->
                <input type="hidden" th:field="*{idPedido}" />

                <div class="form-row">
                    <label for="direccionEntrega">Dirección de Entrega:</label>
                    <input type="text" id="direccionEntrega" th:field="*{direccionEntrega}" required />
                </div>

                <div class="form-row">
                    <label for="usuario">Usuario:</label>
                    <select id="usuario" th:field="*{usuario.idUsuario}" required>
                        <option value="" disabled>Seleccione un usuario</option>
                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.idUsuario}"
                                th:text="${usuario.nombre}"
                                th:selected="${usuario.idUsuario == pedido.usuario.idUsuario}">
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="fechaPedido">Fecha del Pedido:</label>
                    <input type="date" id="fechaPedido" th:field="*{fechaPedido}" required />
                </div>

                <div class="form-row">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" th:field="*{estado}" required />
                </div>

                <button type="submit" class="primary">Actualizar</button>
                <a th:href="@{/pedidos}" class="small-link" style="margin-left:1rem;">Cancelar</a>
            </form>
        </div>
    </main>
</html>
