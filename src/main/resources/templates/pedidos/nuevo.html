<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::section})}">
<head>
    <title>Registrar Pedido - Licorería Don Polo</title>
    <link rel="stylesheet" th:href="@{/css/pedidos.css}" href="/css/pedidos.css" />
</head>
<body>
    <!-- Encabezado común -->
    <div th:replace="~{layout :: header}"></div>

    <!-- Contenido principal -->
    <main class="main-content" th:fragment="content">
        <div class="card">
            <h2>Registrar Nuevo Pedido</h2>
            <form th:action="@{/pedidos/guardar}" th:object="${pedido}" method="post">
                <div class="form-row">
                    <label for="direccionEntrega">Dirección de Entrega:</label>
                    <input type="text" id="direccionEntrega" th:field="*{direccionEntrega}" required />
                </div>

                <div class="form-row">
                    <label for="usuario">Usuario:</label>
                    <select id="usuario" th:field="*{usuario}" required>
                        <option value="">Seleccione un usuario</option>
                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.idUsuario}"
                                th:text="${usuario.nombre}">
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="fechaPedido">Fecha del Pedido:</label>
                    <input type="date" id="fechaPedido" th:field="*{fechaPedido}" required />
                </div>

                <div class="form-row">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" th:field="*{estado}" required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary">Guardar</button>
                    <a th:href="@{/pedidos}" class="secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Pie de página -->
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
