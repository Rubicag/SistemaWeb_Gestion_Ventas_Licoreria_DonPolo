<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
</head>
<body>
    <h1>Clientes</h1>
    <div th:if="${clientes == null or #lists.isEmpty(clientes)}">
        <p>No hay clientes registrados.</p>
    </div>
    <div th:if="${clientes != null and !#lists.isEmpty(clientes)}">
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.email}"></td>
                    <td>
                        <a th:href="@{'/clientes/editar/' + ${cliente.id}}">Editar</a> |
                        <a th:href="@{'/clientes/eliminar/' + ${cliente.id}}" onclick="return confirm('¿Seguro que deseas eliminar este cliente?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/clientes/nuevo}" style="margin-top:1em;display:inline-block;">Agregar Cliente</a>
</body>
</html>
